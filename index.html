<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kladde</title>
<meta name="theme-color" content="#1F45C4">
<meta name="description" content="Notizheft mit Tagezähler – alles bleibt auf deinem Gerät.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kladde">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-display:swap;font-weight:200 800;font-stretch:75% 100%;src:url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-display:swap;font-weight:200 800;font-stretch:75% 100%;src:url(fonts/bricolage-grotesque-latin-ext-standard-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Newsreader';font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/newsreader-latin-standard-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Newsreader';font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/newsreader-latin-ext-standard-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#F4F5F8; --card:#FFFFFF; --ink:#1F45C4; --ink-weak:#E6ECFB; --text:#161922; --muted:#666D80;
  --line:#E0E4EC; --red:#CF3528; --red-weak:#FCE9E7; --green:#23884F; --scrim:rgba(12,16,30,.45);
  --ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --card:#172038; --ink:#93AAFF; --ink-weak:#1F2B50; --text:#E8EBF4; --muted:#8C94AD;
    --line:#26314F; --red:#FF7568; --red-weak:#3A1E24; --green:#5CCB8A; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --card:#172038; --ink:#93AAFF; --ink-weak:#1F2B50; --text:#E8EBF4; --muted:#8C94AD;
  --line:#26314F; --red:#FF7568; --red-weak:#3A1E24; --green:#5CCB8A; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.page{max-width:620px;margin:0 auto;padding:18px 16px 170px}
h1{margin:6px 0 2px;font-size:34px;font-weight:800;font-variation-settings:"wdth" 85;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin-bottom:14px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:16px;height:100%}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--ink)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--red-weak);color:var(--text);font-size:14px}
.banner button{font-weight:700;color:var(--red);white-space:nowrap}

.list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item:active{transform:scale(.99);background:var(--ink-weak)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item h3{margin:0;font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.date{font-size:13px;color:var(--muted);white-space:nowrap}
.preview{margin:5px 0 0;font-family:var(--read);font-size:16px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--ink-weak);color:var(--ink)}

.group{margin:22px 0 0;font-size:15px;font-weight:700;color:var(--muted)}
.group+.list{margin-top:8px}
.counter{display:flex;align-items:center;gap:14px}
.counter .info{flex:1;min-width:0}
.counter .when{font-size:14px;color:var(--muted);margin-top:3px}
.counter .extra{font-size:13px;color:var(--muted);margin-top:2px}
.num{flex:none;text-align:right}
.num b{display:block;font-size:44px;line-height:.95;font-weight:800;font-variation-settings:"wdth" 78;color:var(--ink);font-variant-numeric:tabular-nums}
.num span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.counter[data-tone="soon"] .num b,.counter[data-tone="over"] .num b{color:var(--red)}
.counter[data-tone="over"] .num span{color:var(--red)}
.counter[data-tone="future"] .num b{color:var(--muted)}

.empty{margin-top:34px;text-align:center;padding:0 20px}
.empty strong{display:block;font-size:20px;margin-bottom:6px}
.empty p{margin:0 auto;max-width:34ch;color:var(--muted);font-family:var(--read);font-size:17px;line-height:1.5}

.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:9;
  display:flex;align-items:center;gap:8px;height:54px;padding:0 20px 0 16px;border-radius:999px;background:var(--ink);color:var(--card);
  font-weight:700;font-size:16px;box-shadow:0 8px 22px color-mix(in srgb,var(--ink) 35%,transparent)}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.96)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:8;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line)}
nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:66px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}

/* Sicherung */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.panel h2{margin:0 0 6px;font-size:18px}
.panel p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.panel p+p{margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;font-weight:700;font-size:16px;margin-top:12px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.secondary{background:var(--ink-weak);color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.stat:first-of-type{border-top:0}
.stat span:first-child{color:var(--muted)}
.ok{color:var(--green)}
.warn{color:var(--red)}
.msg{margin-top:10px;font-size:14px}
textarea.dump{width:100%;height:140px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;background:var(--bg)}

/* Editor */
.editor{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.editor.open{transform:none;visibility:visible}
.ebar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.ebar h2{margin:0;font-size:16px;font-weight:700;text-align:center}
.ebar button{font-size:16px;padding:10px 6px}
.ebar .cancel{justify-self:start;color:var(--muted)}
.ebar .save{justify-self:end;color:var(--ink);font-weight:800}
.efields{flex:1;overflow-y:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:620px;width:100%;margin:0 auto}
.lbl{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:20px 0 8px}
.lbl:first-child{margin-top:0}
.field{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;outline:none}
.field:focus{border-color:var(--ink)}
.field::placeholder{color:var(--muted)}
.field.title{font-size:20px;font-weight:700}
textarea.field.body{min-height:42vh;resize:none;font-family:var(--read);font-size:18px;line-height:1.55}
.taginput{display:flex;gap:8px}
.taginput .field{flex:1}
.taginput button{flex:none;padding:0 16px;border-radius:12px;background:var(--ink-weak);color:var(--ink);font-weight:700}
.chosen{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chosen .chip{background:var(--ink);border-color:var(--ink);color:var(--card);display:flex;align-items:center;gap:6px;padding-right:8px}
.chosen .chip b{font-weight:400;font-size:18px;line-height:1}
.hint{font-size:14px;color:var(--muted);margin-top:8px}
.modes{display:grid;gap:8px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.mode .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.mode[aria-checked="true"]{border-color:var(--ink);background:var(--ink-weak)}
.mode[aria-checked="true"] .dot{border:6px solid var(--ink)}
.mode strong{display:block;font-size:16px}
.mode small{display:block;color:var(--muted);font-size:14px;margin-top:1px}
.pv{margin-top:8px}
.del-wrap{margin-top:30px}

/* Dialog */
.dlg{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:var(--scrim)}
.dlg .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%}
.dlg h3{margin:0 0 6px;font-size:19px}
.dlg p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.dlg .acts button{height:46px;border-radius:12px;font-weight:700}
.dlg .no{background:var(--bg)}
.dlg .yes{background:var(--ink);color:var(--card)}
.dlg .yes.red{background:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);z-index:50;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:90vw}
@media (prefers-reduced-motion:reduce){.editor{transition:none}}
/* v2 */
.toast{display:flex;align-items:center;gap:14px}
.toast button{color:var(--bg);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.pin{display:inline-block;width:15px;height:15px;color:var(--ink);vertical-align:-2px;margin-right:4px;flex:none}
.today{margin-top:14px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px}
.today h2{margin:0 0 6px;font-size:15px;color:var(--ink)}
.today button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.today button:first-of-type{border-top:0}
.today button span:last-child{color:var(--muted);white-space:nowrap}
.today button .hot{color:var(--red);font-weight:700}
.cl{margin-top:8px;display:grid;gap:2px}
.cli{display:flex;align-items:flex-start;gap:10px;font-size:16px;padding:3px 0;text-align:left;width:100%}
.ck{flex:none;width:20px;height:20px;margin-top:1px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.ck svg{width:14px;height:14px;opacity:0}
.cli[aria-checked="true"] .ck,.clrow .cb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.cli[aria-checked="true"] .ck svg,.clrow .cb[aria-pressed="true"] svg{opacity:1;color:var(--card)}
.cli[aria-checked="true"] .t{text-decoration:line-through;color:var(--muted)}
.more{font-size:14px;color:var(--muted);margin-top:2px}
.prog{font-size:13px;color:var(--ink);font-weight:700}
.clrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px;margin-top:6px}
.clrow:focus-within{border-color:var(--ink)}
.clrow .cb{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center}
.clrow .cb svg{width:15px;height:15px;opacity:0}
.clrow input{flex:1;border:0;outline:none;background:transparent;font-size:17px;padding:9px 0;min-width:0}
.clrow input.done{text-decoration:line-through;color:var(--muted)}
.clrow .x{flex:none;width:36px;height:36px;font-size:22px;color:var(--muted);border-radius:8px}
.addrow{margin-top:8px;padding:10px 12px;color:var(--ink);font-weight:700;border-radius:10px}
.addrow:active{background:var(--ink-weak)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;text-align:left}
.switch i{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"] i{background:var(--ink)}
.switch[aria-checked="true"] i::after{transform:translateX(18px)}
.streak{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.streak h3{margin:0 0 4px;font-size:16px}
.badge{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--red-weak);color:var(--red)}
.counter[data-tone="mile"]{border-color:var(--red);border-width:1.5px}
.counter[data-tone="mile"] .num b{color:var(--red)}
.trash{display:grid;gap:0}
.trow{padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow strong{display:block;font-size:16px;overflow-wrap:anywhere}
.trow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tacts{display:flex;gap:8px;margin-top:8px}
.tacts button{flex:1;height:40px;border-radius:10px;font-weight:700;font-size:15px}
.tacts .r{background:var(--ink-weak);color:var(--ink)}
.tacts .d{color:var(--red);border:1.5px solid var(--red)}
</style>
</head>
<body>
<div class="page">
  <h1 id="h1">Notizen</h1>
  <div class="sub" id="sub"></div>
  <div id="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Suchen" autocomplete="off" aria-label="Suchen"></label>
    <div class="chips" id="chips"></div>
  </div>
  <div id="top"></div>
  <main id="main"></main>
</div>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fabl">Notiz</span></button>

<nav><div class="in" role="tablist">
  <button class="tab" role="tab" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>Notizen</button>
  <button class="tab" role="tab" data-tab="counters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Zähler</button>
  <button class="tab" role="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mehr</button>
</div></nav>

<div class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="etitle">
  <div class="ebar">
    <button class="cancel" id="cancel">Abbrechen</button>
    <h2 id="etitle">Neue Notiz</h2>
    <button class="save" id="save">Speichern</button>
  </div>
  <div class="efields" id="efields"></div>
</div>

<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(function(){
const LS='kladde.v1', LSB='kladde.lastBackup', LST='kladde.tab', TRASH_DAYS=30;
let items={}, tab='notes', q='', tagFilter=null, draft=null, orig='', isNew=false;
const PIN='<svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-label="angepinnt"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z"/></svg>';
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function load(){
  try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&s.items)items=s.items;
    const t=localStorage.getItem(LST);if(t==='backup')tab='more';else if(['notes','counters','more'].includes(t))tab=t;}catch(e){}
  for(const i of Object.values(items)){if(i.kind==='mark')i.kind='counter'}
  const cut=Date.now()-TRASH_DAYS*864e5;let purged=false;
  for(const id in items){if(items[id].deletedAt&&items[id].deletedAt<cut){delete items[id];purged=true}}
  if(purged)save();
}
function save(){try{localStorage.setItem(LS,JSON.stringify({items}));return true}catch(e){toast('Speichern fehlgeschlagen – Gerätespeicher voll?');return false}}
load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let toastEl=null,toastT=0;
function toast(t,label,fn){
  if(toastEl)toastEl.remove();clearTimeout(toastT);
  const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');
  d.innerHTML=`<span>${esc(t)}</span>${label?`<button>${esc(label)}</button>`:''}`;
  if(label)d.querySelector('button').onclick=()=>{d.remove();fn()};
  document.body.appendChild(d);toastEl=d;toastT=setTimeout(()=>d.remove(),label?6000:2600);
}
function ask(title,text,yes,red,no){return new Promise(r=>{
  const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div class="box" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="no">${esc(no||'Abbrechen')}</button><button class="yes ${red?'red':''}">${esc(yes)}</button></div></div>`;
  document.body.appendChild(d);d.querySelector('.yes').focus();
  const done=v=>{d.remove();r(v)};
  d.querySelector('.no').onclick=()=>done(false);d.querySelector('.yes').onclick=()=>done(true);
  d.onclick=e=>{if(e.target===d)done(null)};
})}

/* ---------- Datum ---------- */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function P(s){const[y,m,d]=String(s).split('-').map(Number);return{y,m,d}}
function U(p){return Date.UTC(p.y,p.m-1,p.d)}
function diff(a,b){return Math.round((U(b)-U(a))/864e5)}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function addDays(p,n){const d=new Date(U(p)+n*864e5);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}}
function fmt(p,y=true){return new Date(U(p)).toLocaleDateString('de-DE',y?{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}:{day:'numeric',month:'long',timeZone:'UTC'})}
function span(a,b){
  let y=b.y-a.y,m=b.m-a.m,d=b.d-a.d;
  if(d<0){m--;const pm=b.m===1?12:b.m-1,py=b.m===1?b.y-1:b.y;d+=dim(py,pm)}
  if(m<0){y--;m+=12}
  const o=[];if(y)o.push(y+(y===1?' Jahr':' Jahre'));if(m)o.push(m+(m===1?' Monat':' Monate'));if(d)o.push(d+(d===1?' Tag':' Tage'));
  return o.join(', ');
}
const T=n=>Math.abs(n)===1?'Tag':'Tage';
const inDays=n=>n===0?'heute':n===1?'morgen':'in '+n+' Tagen';

/* Meilensteine für "seit"-Zähler: feste Tageszahlen + jeder Jahrestag */
const DAY_MS=[7,30,50,100,200,300,500,1000];
function milestones(c){
  const p=P(c.date),t=P(today()),d=diff(p,t);
  if(d<0)return null;
  const days=[...DAY_MS];for(let n=1500;n<=d+1500;n+=500)days.push(n);
  let hitToday=null,next=null;
  if(days.includes(d))hitToday=d+' Tage';
  const nd=days.find(n=>n>d);
  if(nd)next={label:nd+' Tage',in:nd-d};
  for(let k=1;k<200;k++){
    const ay=p.y+k,an={y:ay,m:p.m,d:Math.min(p.d,dim(ay,p.m))},dd=diff(t,an);
    if(dd===0){hitToday=k+(k===1?' Jahr':' Jahre')}
    if(dd>0){if(!next||dd<next.in)next={label:k+(k===1?' Jahr':' Jahre'),in:dd};break}
  }
  return{hitToday,next};
}
function calc(c){
  const t=P(today()),p=P(c.date||today());
  if(c.mode==='since'){
    const d=diff(p,t);
    if(d<0)return{num:-d,unit:T(d)+' bis zum Start',when:'Beginnt am '+fmt(p),tone:'future',k:d};
    const ms=milestones(c)||{};
    const best=Math.max(c.best||0,d);
    const r={num:d,unit:d===0?'Tage – heute gestartet':T(d)+' seit',when:'Seit '+fmt(p),extra:d>=31?span(p,t):'',tone:'',k:d,ms};
    if(ms.hitToday){r.tone='mile';r.badge='🎉 Heute: '+ms.hitToday}
    else if(ms.next)r.next='Nächster Meilenstein: '+ms.next.label+', '+inDays(ms.next.in);
    if(c.best&&c.best>d)r.best='Rekord: '+c.best+' '+T(c.best);
    else if(c.restarts)r.best='Neuer Rekord läuft';
    r.bestNum=best;
    return r;
  }
  if(c.mode==='until'){
    const d=diff(t,p);
    if(d<0)return{num:-d,unit:T(d)+' überfällig',when:'War am '+fmt(p),tone:'over',k:d};
    if(d===0)return{num:0,unit:'Heute ist es so weit',when:'Heute, '+fmt(p),tone:'soon',k:0};
    return{num:d,unit:T(d)+' noch',when:'Am '+fmt(p),extra:d>=31?span(t,p):'',tone:d<=7?'soon':'',k:d};
  }
  let y=t.y,nx={y,m:p.m,d:Math.min(p.d,dim(y,p.m))};
  if(diff(t,nx)<0){y++;nx={y,m:p.m,d:Math.min(p.d,dim(y,p.m))}}
  const d=diff(t,nx),n=nx.y-p.y;
  const nth=n>0?` (${n}. Mal)`:'';
  if(d===0)return{num:0,unit:'Heute'+nth,when:'Jedes Jahr am '+fmt(p,false),tone:'soon',k:0};
  return{num:d,unit:T(d)+' noch',when:'Nächstes Mal am '+fmt(nx)+nth,extra:'Jedes Jahr, seit '+p.y,tone:d<=7?'soon':'',k:d};
}

/* ---------- Daten ---------- */
const live=()=>Object.values(items).filter(i=>!i.deletedAt);
const notes=()=>live().filter(i=>i.kind==='note');
const counters=()=>live().filter(i=>i.kind==='counter');
const trashed=()=>Object.values(items).filter(i=>i.deletedAt).sort((a,b)=>b.deletedAt-a.deletedAt);
const hit=i=>!q||[i.title,i.body,i.note,(i.tags||[]).join(' '),(i.checklist||[]).map(x=>x.text).join(' ')].join(' ').toLowerCase().includes(q.toLowerCase());
function tags(){const m=new Map();notes().forEach(n=>(n.tags||[]).forEach(t=>m.set(t.toLowerCase(),t)));return[...m.values()].sort((a,b)=>a.localeCompare(b,'de'))}
const same=(a,b)=>a&&b&&a.toLowerCase()===b.toLowerCase();
function lastBackup(){try{return+localStorage.getItem(LSB)||0}catch(e){return 0}}
const daysSince=ts=>Math.floor((Date.now()-ts)/864e5);
function touch(it){it.updatedAt=Date.now();items[it.id]=it;save()}
function noteTitle(n){
  const body=(n.body||'').trim();
  return (n.title||'').trim()||body.split('\n')[0]||((n.checklist||[]).length?'Checkliste':'Ohne Titel');
}
function softDelete(id){
  const it=items[id];if(!it)return;
  it.deletedAt=Date.now();touch(it);render();
  toast(it.kind==='note'?'Notiz gelöscht':'Zähler gelöscht','Rückgängig',()=>{delete it.deletedAt;touch(it);render()});
}

/* ---------- Heute-Hinweis ---------- */
function todayList(){
  const out=[];
  for(const c of counters()){
    const r=calc(c);
    if(c.mode==='until'&&r.k>=-7&&r.k<=3)out.push({id:c.id,t:c.title,l:r.k<0?(-r.k)+' '+T(r.k)+' überfällig':inDays(r.k),hot:r.k<=0,k:r.k});
    else if(c.mode==='yearly'&&r.k<=3)out.push({id:c.id,t:c.title,l:inDays(r.k),hot:r.k===0,k:r.k});
    else if(c.mode==='since'&&r.ms&&r.ms.hitToday)out.push({id:c.id,t:c.title,l:'🎉 '+r.ms.hitToday,hot:true,k:0});
    else if(c.mode==='since'&&r.ms&&r.ms.next&&r.ms.next.in<=3)out.push({id:c.id,t:c.title,l:r.ms.next.label+' '+inDays(r.ms.next.in),hot:false,k:r.ms.next.in});
  }
  return out.sort((a,b)=>a.k-b.k);
}

/* ---------- Rendern ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const nN=notes().length,nC=counters().length;
  $('#h1').textContent={notes:'Notizen',counters:'Zähler',more:'Mehr'}[tab];
  $('#sub').textContent=tab==='notes'?(nN===1?'1 Notiz':nN+' Notizen'):tab==='counters'?(nC===1?'1 Zähler':nC+' Zähler'):'Papierkorb und Sicherung';
  $('#tools').hidden=tab==='more';
  $('#fab').hidden=tab==='more';
  $('#fabl').textContent=tab==='notes'?'Neue Notiz':'Neuer Zähler';
  $('#q').placeholder=tab==='notes'?'Notizen durchsuchen':'Zähler durchsuchen';
  const ch=$('#chips');
  if(tab==='notes'&&tags().length){
    if(tagFilter&&!tags().some(t=>same(t,tagFilter)))tagFilter=null;
    ch.hidden=false;
    ch.innerHTML=`<button class="chip" data-tag="" aria-pressed="${!tagFilter}">Alle</button>`+tags().map(t=>`<button class="chip" data-tag="${esc(t)}" aria-pressed="${same(t,tagFilter)}">#${esc(t)}</button>`).join('');
  }else ch.hidden=true;
  let top='';
  if(tab!=='more'&&!q){
    const tl=todayList();
    if(tl.length)top+=`<div class="today"><h2>Heute und die nächsten Tage</h2>${tl.map(x=>`<button data-id="${esc(x.id)}"><span>${esc(x.t||'Ohne Namen')}</span><span class="${x.hot?'hot':''}">${esc(x.l)}</span></button>`).join('')}</div>`;
    const lb=lastBackup(),total=nN+nC;
    if(total>=3&&(!lb||daysSince(lb)>=14))top+=`<div class="banner"><span>${lb?'Letzte Sicherung vor '+daysSince(lb)+' Tagen.':'Du hast noch keine Sicherung gemacht.'}</span><button data-go="more">Jetzt sichern</button></div>`;
  }
  $('#top').innerHTML=top;
  ({notes:renderNotes,counters:renderCounters,more:renderMore})[tab]();
}

function noteCard(n){
  const body=(n.body||'').trim();
  const prev=(n.title||'').trim()?body:body.split('\n').slice(1).join('\n').trim();
  const d=new Date(n.updatedAt||Date.now());
  const cl=(n.checklist||[]).filter(x=>x.text.trim());
  const done=cl.filter(x=>x.done).length;
  const shown=cl.slice(0,5);
  return `<li><div class="item" data-id="${esc(n.id)}" role="button" tabindex="0"><div class="row"><h3>${n.pinned?PIN:''}${esc(noteTitle(n))}</h3><span class="date">${d.toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</span></div>
    ${prev?`<p class="preview">${esc(prev)}</p>`:''}
    ${cl.length?`<div class="cl"><div class="prog">${done} von ${cl.length} erledigt</div>${shown.map(x=>`<button class="cli" role="checkbox" aria-checked="${!!x.done}" data-note="${esc(n.id)}" data-check="${esc(x.id)}"><span class="ck">${TICK}</span><span class="t">${esc(x.text)}</span></button>`).join('')}${cl.length>5?`<div class="more">+ ${cl.length-5} weitere</div>`:''}</div>`:''}
    ${(n.tags||[]).length?`<div class="tags">${n.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}</div></li>`;
}
function renderNotes(){
  let l=notes().filter(hit);
  if(tagFilter)l=l.filter(n=>(n.tags||[]).some(t=>same(t,tagFilter)));
  l.sort((a,b)=>(!!b.pinned-!!a.pinned)||((b.updatedAt||0)-(a.updatedAt||0)));
  if(!l.length){$('#main').innerHTML=notes().length
    ?`<div class="empty"><strong>Keine Treffer</strong><p>Probier einen anderen Suchbegriff oder tippe auf „Alle“.</p></div>`
    :`<div class="empty"><strong>Noch keine Notizen</strong><p>Tippe unten rechts auf „Neue Notiz“, um loszuschreiben.</p></div>`;return}
  $('#main').innerHTML='<ul class="list">'+l.map(noteCard).join('')+'</ul>';
}
function counterCard(c,asDiv){
  const r=calc(c),tag=asDiv?'div':'button';
  return `<li><${tag} class="item counter" data-id="${esc(c.id)}" data-tone="${r.tone}"><div class="info"><h3>${c.pinned?PIN:''}${esc(c.title||'Ohne Namen')}</h3>
    <div class="when">${esc(r.when)}</div>${r.extra?`<div class="extra">${esc(r.extra)}</div>`:''}
    ${r.best?`<div class="extra">${esc(r.best)}</div>`:''}
    ${r.next?`<div class="extra">${esc(r.next)}</div>`:''}
    ${r.badge?`<span class="badge">${esc(r.badge)}</span>`:''}
    ${c.note?`<p class="preview">${esc(c.note)}</p>`:''}</div>
    <div class="num"><b>${r.num}</b><span>${esc(r.unit)}</span></div></${tag}></li>`;
}
function renderCounters(){
  const all=counters().filter(hit);
  if(!all.length){$('#main').innerHTML=counters().length
    ?`<div class="empty"><strong>Keine Treffer</strong><p>Probier einen anderen Suchbegriff.</p></div>`
    :`<div class="empty"><strong>Noch keine Zähler</strong><p>Ein Zähler zeigt dir, wie viele Tage seit oder bis zu einem Datum vergehen. Tippe unten rechts auf „Neuer Zähler“.</p></div>`;return}
  const pinned=all.filter(c=>c.pinned).sort((a,b)=>calc(a).k-calc(b).k);
  const rest=all.filter(c=>!c.pinned);
  const up=rest.filter(c=>c.mode!=='since').sort((a,b)=>calc(a).k-calc(b).k);
  const since=rest.filter(c=>c.mode==='since').sort((a,b)=>calc(b).k-calc(a).k);
  let h='';
  if(pinned.length)h+=`<h2 class="group">Angepinnt</h2><ul class="list">${pinned.map(c=>counterCard(c)).join('')}</ul>`;
  if(up.length)h+=`<h2 class="group">Demnächst</h2><ul class="list">${up.map(c=>counterCard(c)).join('')}</ul>`;
  if(since.length)h+=`<h2 class="group">Läuft seit</h2><ul class="list">${since.map(c=>counterCard(c)).join('')}</ul>`;
  $('#main').innerHTML=h;
}

/* ---------- Mehr: Papierkorb + Sicherung ---------- */
function renderMore(){
  const lb=lastBackup(),nN=notes().length,nC=counters().length,tr=trashed();
  $('#main').innerHTML=`
  <div class="panel"><h2>Papierkorb</h2>
    ${tr.length?`<p>Gelöschtes bleibt ${TRASH_DAYS} Tage hier und wird dann automatisch entfernt.</p>
    <div class="trash" style="margin-top:8px">${tr.map(i=>{const left=Math.max(0,TRASH_DAYS-daysSince(i.deletedAt));return`<div class="trow"><strong>${esc(i.kind==='note'?noteTitle(i):(i.title||'Ohne Namen'))}</strong><small>${i.kind==='note'?'Notiz':'Zähler'}, wird ${left<=1?'morgen':'in '+left+' Tagen'} endgültig entfernt</small><div class="tacts"><button class="r" data-restore="${esc(i.id)}">Wiederherstellen</button><button class="d" data-purge="${esc(i.id)}">Endgültig löschen</button></div></div>`}).join('')}</div>
    <button class="btn danger" id="empty">Papierkorb leeren</button>`:'<p>Der Papierkorb ist leer.</p>'}
  </div>
  <div class="panel"><h2>Wo sind meine Daten?</h2>
    <p>Nur hier auf diesem Gerät. Die App hat keinen Server und kein Konto – deine Einträge verlassen das Handy nie, außer du speicherst selbst eine Sicherung.</p>
    <p class="warn">Wenn du die App deinstallierst, die Browserdaten löschst oder das Handy wechselst, ist ohne Sicherungsdatei alles weg.</p>
  </div>
  <div class="panel"><h2>Sicherung</h2>
    <div class="stat"><span>Notizen</span><span>${nN}</span></div>
    <div class="stat"><span>Zähler</span><span>${nC}</span></div>
    <div class="stat"><span>Letzte Sicherung</span><span class="${!lb||daysSince(lb)>=14?'warn':'ok'}">${lb?(daysSince(lb)===0?'heute':'vor '+daysSince(lb)+(daysSince(lb)===1?' Tag':' Tagen')):'noch nie'}</span></div>
    <button class="btn primary" id="bsave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 19h14"/></svg>Sicherung speichern</button>
    <button class="btn secondary" id="bload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M5 5h14"/></svg>Sicherung laden</button>
  </div>`;
  $('#bsave').onclick=doExport;
  $('#bload').onclick=()=>$('#file').click();
  $('#main').querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const it=items[b.dataset.restore];delete it.deletedAt;touch(it);render();toast('Wiederhergestellt')});
  $('#main').querySelectorAll('[data-purge]').forEach(b=>b.onclick=async()=>{if(await ask('Endgültig löschen?','Das kann nicht rückgängig gemacht werden.','Löschen',true)){delete items[b.dataset.purge];save();render()}});
  const em=$('#empty');if(em)em.onclick=async()=>{if(await ask('Papierkorb leeren?',`${tr.length} Einträge werden endgültig gelöscht.`,'Leeren',true)){tr.forEach(i=>delete items[i.id]);save();render()}};
}
async function doExport(){
  const data=JSON.stringify({app:'kladde',version:3,exportedAt:new Date().toISOString(),items:Object.values(items)},null,1);
  const name='kladde-sicherung-'+today()+'.json';
  const file=new File([data],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      const c=await ask('Wohin speichern?','„Teilen“ öffnet z. B. Google Drive, Mail oder WhatsApp an dich selbst. „Herunterladen“ legt die Datei in den Download-Ordner.','Teilen',false,'Herunterladen');
      if(c===null)return;
      if(c){await navigator.share({files:[file],title:name});localStorage.setItem(LSB,String(Date.now()));toast('Sicherung geteilt');render();return}
    }
  }catch(e){if(e&&e.name==='AbortError'){toast('Abgebrochen');return}}
  const url=URL.createObjectURL(file);const l=document.createElement('a');l.href=url;l.download=name;document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  localStorage.setItem(LSB,String(Date.now()));toast('Sicherung im Download-Ordner');render();
}
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let list;
  try{const j=JSON.parse(await f.text());list=Array.isArray(j)?j:j.items;if(!Array.isArray(list))throw 0}
  catch(err){toast('Das ist keine gültige Sicherungsdatei');return}
  list=list.filter(i=>i&&typeof i.id==='string'&&['note','counter','mark'].includes(i.kind)).map(i=>({...i,kind:i.kind==='mark'?'counter':i.kind}));
  const nN=list.filter(i=>i.kind==='note').length,nC=list.length-nN;
  if(!list.length){toast('Die Datei enthält keine Einträge');return}
  if(!await ask('Sicherung laden?',`Gefunden: ${nN} Notizen und ${nC} Zähler. Sie werden mit deinen jetzigen Einträgen zusammengeführt. Bei doppelten Einträgen gewinnt die neuere Fassung.`,'Laden'))return;
  let added=0;
  for(const i of list){const o=items[i.id];if(!o||(i.updatedAt||0)>(o.updatedAt||0)){items[i.id]=i;added++}}
  save();render();toast(added+' Einträge übernommen');
};

/* ---------- Editor ---------- */
function openEditor(item,fresh){
  draft=JSON.parse(JSON.stringify(item));orig=JSON.stringify(draft);isNew=fresh;
  $('#etitle').textContent=draft.kind==='note'?(fresh?'Neue Notiz':'Notiz bearbeiten'):(fresh?'Neuer Zähler':'Zähler bearbeiten');
  draft.kind==='note'?noteForm():counterForm();
  $('#editor').classList.add('open');
  $('#efields').scrollTop=0;
  if(fresh&&draft.kind==='note')setTimeout(()=>{const f=$('#nt');f&&f.focus()},300);
}
function closeEditor(){$('#editor').classList.remove('open');draft=null;render()}
function clean(d){if(d.checklist)d.checklist=d.checklist.filter(x=>x.text.trim());return d}
function isEmpty(d){return d.kind==='note'?!(d.title||'').trim()&&!(d.body||'').trim()&&!(d.checklist||[]).some(x=>x.text.trim()):!(d.title||'').trim()}
function commit(){
  if(!draft)return;
  if(isEmpty(draft)){
    toast(draft.kind==='note'?'Die Notiz ist leer':'Gib dem Zähler einen Namen');
    if(draft.kind==='counter'){const f=$('#ct');f&&f.focus()}
    return;
  }
  clean(draft);
  if(JSON.stringify(draft)!==orig||isNew){touch(draft);toast('Gespeichert')}
  closeEditor();
}
async function cancel(){
  if(!draft)return;
  if(JSON.stringify(draft)!==orig&&!(isNew&&isEmpty(draft))){
    if(!await ask('Änderungen verwerfen?','Was du geändert hast, wird nicht gespeichert.','Verwerfen',true))return;
  }
  closeEditor();
}
function removeFromEditor(){const id=draft.id;draft=null;$('#editor').classList.remove('open');softDelete(id)}
function pinSwitch(){
  return `<button class="switch" role="switch" id="pinsw" aria-checked="${!!draft.pinned}"><span>Oben anpinnen</span><i></i></button>`;
}
function bindPin(){$('#pinsw').onclick=()=>{draft.pinned=!draft.pinned;$('#pinsw').setAttribute('aria-checked',draft.pinned);if(draft.kind==='counter')pv()}}

function noteForm(){
  draft.checklist=draft.checklist||[];
  $('#efields').innerHTML=`
    <label class="lbl" for="nt">Titel</label>
    <input class="field title" id="nt" placeholder="Worum geht es?" value="${esc(draft.title)}">
    <label class="lbl" for="nb">Notiz</label>
    <textarea class="field body" id="nb" placeholder="Hier schreiben …" style="min-height:${draft.checklist.length?'18vh':'34vh'}">${esc(draft.body)}</textarea>
    <span class="lbl">Checkliste <span style="font-weight:400">(optional)</span></span>
    <div id="clw"></div>
    <button class="addrow" id="cladd">+ Punkt hinzufügen</button>
    <label class="lbl" for="ti">Tags <span style="font-weight:400">(optional, zum Sortieren)</span></label>
    <div class="taginput"><input class="field" id="ti" placeholder="z. B. Arbeit" autocomplete="off" autocapitalize="off" enterkeyhint="done"><button id="tadd">Hinzufügen</button></div>
    <div class="chosen" id="chosen"></div>
    <div id="sugw"></div>
    ${pinSwitch()}
    ${isNew?'':'<div class="del-wrap"><button class="btn danger" id="del">Notiz löschen</button></div>'}`;
  $('#nt').oninput=e=>draft.title=e.target.value;
  $('#nb').oninput=e=>draft.body=e.target.value;
  $('#cladd').onclick=()=>addItem(draft.checklist.length);
  const add=()=>{const v=$('#ti').value.replace(/^#+/,'').trim();if(v&&!(draft.tags||[]).some(t=>same(t,v))){draft.tags=[...(draft.tags||[]),v]}$('#ti').value='';drawTags()};
  $('#tadd').onclick=add;
  $('#ti').onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add()}};
  $('#ti').oninput=drawTags;
  bindPin();
  if(!isNew)$('#del').onclick=removeFromEditor;
  drawList();drawTags();
}
function addItem(at){draft.checklist.splice(at,0,{id:newId('i'),text:'',done:false});drawList(at)}
function drawList(focusAt){
  const w=$('#clw');
  w.innerHTML=draft.checklist.map((x,i)=>`<div class="clrow"><button class="cb" aria-pressed="${!!x.done}" aria-label="abhaken" data-i="${i}">${TICK}</button><input data-i="${i}" class="${x.done?'done':''}" value="${esc(x.text)}" placeholder="Punkt" enterkeyhint="next"><button class="x" data-i="${i}" aria-label="Punkt entfernen">×</button></div>`).join('');
  w.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{const x=draft.checklist[+b.dataset.i];x.done=!x.done;drawList()});
  w.querySelectorAll('.x').forEach(b=>b.onclick=()=>{draft.checklist.splice(+b.dataset.i,1);drawList()});
  w.querySelectorAll('input').forEach(inp=>{
    const i=+inp.dataset.i;
    inp.oninput=()=>draft.checklist[i].text=inp.value;
    inp.onkeydown=e=>{
      if(e.key==='Enter'){e.preventDefault();addItem(i+1)}
      else if(e.key==='Backspace'&&!inp.value){e.preventDefault();draft.checklist.splice(i,1);drawList(Math.max(0,i-1))}
    };
  });
  if(focusAt!=null){const f=w.querySelector(`input[data-i="${focusAt}"]`);if(f){f.focus();const v=f.value;f.value='';f.value=v}}
}
function drawTags(){
  draft.tags=draft.tags||[];
  $('#chosen').innerHTML=draft.tags.map((t,i)=>`<button class="chip" data-rm="${i}" aria-label="Tag ${esc(t)} entfernen">#${esc(t)} <b>×</b></button>`).join('');
  $('#chosen').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{draft.tags.splice(+b.dataset.rm,1);drawTags()});
  const v=($('#ti').value||'').replace(/^#/,'').toLowerCase();
  const s=tags().filter(t=>!draft.tags.some(x=>same(x,t))&&t.toLowerCase().includes(v)).slice(0,10);
  $('#sugw').innerHTML=s.length?`<div class="hint">Schon benutzt – antippen zum Hinzufügen:</div><div class="chosen">${s.map(t=>`<button class="chip" style="background:var(--card);color:var(--text);border-color:var(--line)" data-s="${esc(t)}">#${esc(t)}</button>`).join('')}</div>`:'';
  $('#sugw').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{draft.tags.push(b.dataset.s);$('#ti').value='';drawTags()});
}

const MODES=[
  ['since','Tage seit einem Ereignis','z. B. rauchfrei, Umzug, Start im Job','Seit wann?','z. B. Rauchfrei'],
  ['until','Tage bis zu einem Termin','z. B. Urlaub, Frist, Prüfung','Bis wann?','z. B. Urlaub'],
  ['yearly','Jedes Jahr wiederkehrend','z. B. Geburtstag, Hochzeitstag','Ursprüngliches Datum','z. B. Geburtstag']];
function counterForm(){
  const m=MODES.find(x=>x[0]===draft.mode)||MODES[0];
  $('#efields').innerHTML=`
    <span class="lbl">Was möchtest du zählen?</span>
    <div class="modes" role="radiogroup">${MODES.map(x=>`<button class="mode" role="radio" data-m="${x[0]}" aria-checked="${draft.mode===x[0]}"><span class="dot"></span><span><strong>${x[1]}</strong><small>${x[2]}</small></span></button>`).join('')}</div>
    <label class="lbl" for="ct">Name</label>
    <input class="field title" id="ct" placeholder="${esc(m[4])}" value="${esc(draft.title)}">
    <label class="lbl" for="cd" id="cdl">${esc(m[3])}</label>
    <input class="field" id="cd" type="date" value="${esc(draft.date)}">
    <label class="lbl" for="cn">Notiz <span style="font-weight:400">(optional)</span></label>
    <input class="field" id="cn" placeholder="Kurze Ergänzung" value="${esc(draft.note)}">
    ${pinSwitch()}
    <div id="streakw"></div>
    <span class="lbl">So sieht es in der Liste aus</span>
    <ul class="list pv" id="pv"></ul>
    ${isNew?'':'<div class="del-wrap"><button class="btn danger" id="del">Zähler löschen</button></div>'}`;
  $('#efields').querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
    draft.mode=b.dataset.m;const x=MODES.find(y=>y[0]===draft.mode);
    $('#efields').querySelectorAll('.mode').forEach(o=>o.setAttribute('aria-checked',o===b));
    $('#cdl').textContent=x[3];$('#ct').placeholder=x[4];pv();
  });
  $('#ct').oninput=e=>{draft.title=e.target.value;pv()};
  $('#cn').oninput=e=>{draft.note=e.target.value;pv()};
  $('#cd').onchange=e=>{draft.date=e.target.value||today();pv()};
  bindPin();
  if(!isNew)$('#del').onclick=removeFromEditor;
  pv();
}
function streakBox(){
  const w=$('#streakw');if(!w)return;
  if(isNew||draft.mode!=='since'){w.innerHTML='';return}
  const d=Math.max(0,diff(P(draft.date),P(today())));
  const best=Math.max(draft.best||0,d);
  w.innerHTML=`<div class="streak"><h3>Serie</h3>
    <div class="stat"><span>Aktuell</span><span>${d} ${T(d)}</span></div>
    <div class="stat"><span>Rekord</span><span>${best} ${T(best)}</span></div>
    <div class="stat"><span>Neu gestartet</span><span>${draft.restarts||0} Mal</span></div>
    <button class="btn secondary" id="restart">Neu starten ab heute</button>
    <div class="hint">Zum Beispiel nach einem Rückfall. Die bisherige Serie zählt weiter für den Rekord.</div></div>`;
  $('#restart').onclick=async()=>{
    if(!await ask('Neu starten?',`Der Zähler springt auf 0 und beginnt heute. Dein Rekord von ${best} ${T(best)} bleibt gespeichert.`,'Neu starten',true))return;
    const it=JSON.parse(JSON.stringify(draft));
    it.best=best;it.restarts=(it.restarts||0)+1;
    it.history=[...(it.history||[]),{from:it.date,to:today(),days:d}].slice(-50);
    it.date=today();touch(clean(it));draft=null;$('#editor').classList.remove('open');render();
    toast('Neu gestartet. Rekord: '+best+' '+T(best));
  };
}
function pv(){$('#pv').innerHTML=counterCard({...draft,title:draft.title||'Ohne Namen'},true);streakBox()}

/* ---------- Events ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;q='';$('#q').value='';try{localStorage.setItem(LST,tab)}catch(e){}render();window.scrollTo(0,0)});
$('#q').oninput=e=>{q=e.target.value.trim();render()};
$('#chips').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;tagFilter=b.dataset.tag||null;render()};
function openById(id){if(items[id]&&!items[id].deletedAt)openEditor(items[id],false)}
$('#top').onclick=e=>{
  if(e.target.closest('[data-go]')){tab='more';render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-id]');if(b)openById(b.dataset.id);
};
$('#main').onclick=e=>{
  const c=e.target.closest('[data-check]');
  if(c){const n=items[c.dataset.note];const x=n&&(n.checklist||[]).find(y=>y.id===c.dataset.check);if(x){x.done=!x.done;touch(n);render()}return}
  const b=e.target.closest('.item[data-id]');if(b)openById(b.dataset.id);
};
$('#main').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.item[data-id]')){e.preventDefault();openById(e.target.dataset.id)}};
$('#fab').onclick=()=>{
  if(tab==='notes')openEditor({id:newId('n'),kind:'note',title:'',body:'',tags:tagFilter?[tagFilter]:[],checklist:[]},true);
  else openEditor({id:newId('c'),kind:'counter',title:'',date:today(),mode:'since',note:''},true);
};
$('#save').onclick=commit;
$('#cancel').onclick=cancel;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&draft&&!document.querySelector('.dlg'))cancel()});
let day=today();
const tick=()=>{if(today()!==day){day=today();if(!draft)render()}};
setInterval(tick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- Offline / Installation ---------- */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

render();
})();
</script>
</body>
</html>
