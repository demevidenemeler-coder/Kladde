<title>Kladde</title>
<meta name="theme-color" content="#1F45C4">
<meta name="description" content="Notizheft mit Tagezähler – alles bleibt auf deinem Gerät.">

<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-display:swap;font-weight:200 800;font-stretch:75% 100%;src:url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-display:swap;font-weight:200 800;font-stretch:75% 100%;src:url(fonts/bricolage-grotesque-latin-ext-standard-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Newsreader';font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/newsreader-latin-standard-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Newsreader';font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/newsreader-latin-ext-standard-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#F4F5F8; --card:#FFFFFF; --ink:#1F45C4; --ink-weak:#E6ECFB; --text:#161922; --muted:#666D80;
  --line:#E0E4EC;--col-red:#E0453A;--col-orange:#EE8A1E;--col-yellow:#E8C21C;--col-green:#2FA35C;--col-teal:#1AA3A3;--col-blue:#2F6BEA;--col-purple:#8A4FD8;--col-pink:#E0508F; --red:#CF3528; --red-weak:#FCE9E7; --green:#23884F; --scrim:rgba(12,16,30,.45);
  --tint:20%;
  --ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --card:#172038; --ink:#93AAFF; --ink-weak:#1F2B50; --text:#E8EBF4; --muted:#8C94AD;
    --line:#26314F;--tint:26%;--col-red:#FF6F63;--col-orange:#FFA24D;--col-yellow:#F4D23C;--col-green:#4FD08A;--col-teal:#3FD0CC;--col-blue:#6E9BFF;--col-purple:#B48CFF;--col-pink:#FF7EB3; --red:#FF7568; --red-weak:#3A1E24; --green:#5CCB8A; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --card:#172038; --ink:#93AAFF; --ink-weak:#1F2B50; --text:#E8EBF4; --muted:#8C94AD;
  --line:#26314F;--tint:26%;--col-red:#FF6F63;--col-orange:#FFA24D;--col-yellow:#F4D23C;--col-green:#4FD08A;--col-teal:#3FD0CC;--col-blue:#6E9BFF;--col-purple:#B48CFF;--col-pink:#FF7EB3; --red:#FF7568; --red-weak:#3A1E24; --green:#5CCB8A; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.page{max-width:620px;margin:0 auto;padding:18px 16px 170px}
h1{margin:6px 0 2px;font-size:34px;font-weight:800;font-variation-settings:"wdth" 85;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin-bottom:14px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:16px;height:100%}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--ink)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--red-weak);color:var(--text);font-size:14px}
.banner button{font-weight:700;color:var(--red);white-space:nowrap}

.list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item:active{transform:scale(.99);background:var(--ink-weak)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item h3{margin:0;font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.date{font-size:13px;color:var(--muted);white-space:nowrap}
.preview{margin:5px 0 0;font-family:var(--read);font-size:16px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--ink-weak);color:var(--ink)}

.group{margin:22px 0 0;font-size:15px;font-weight:700;color:var(--muted)}
.group+.list{margin-top:8px}
.counter{display:flex;align-items:center;gap:14px}
.counter .info{flex:1;min-width:0}
.counter .when{font-size:14px;color:var(--muted);margin-top:3px}
.counter .extra{font-size:13px;color:var(--muted);margin-top:2px}
.num{flex:none;text-align:right}
.num b{display:block;font-size:44px;line-height:.95;font-weight:800;font-variation-settings:"wdth" 78;color:var(--ink);font-variant-numeric:tabular-nums}
.num span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.counter[data-tone="soon"] .num b,.counter[data-tone="over"] .num b{color:var(--red)}
.counter[data-tone="over"] .num span{color:var(--red)}
.counter[data-tone="future"] .num b{color:var(--muted)}

.empty{margin-top:34px;text-align:center;padding:0 20px}
.empty strong{display:block;font-size:20px;margin-bottom:6px}
.empty p{margin:0 auto;max-width:34ch;color:var(--muted);font-family:var(--read);font-size:17px;line-height:1.5}

.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:9;
  display:flex;align-items:center;gap:8px;height:54px;padding:0 20px 0 16px;border-radius:999px;background:var(--ink);color:var(--card);
  font-weight:700;font-size:16px;box-shadow:0 8px 22px color-mix(in srgb,var(--ink) 35%,transparent)}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.96)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:8;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line)}
nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:66px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}

/* Sicherung */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.panel h2{margin:0 0 6px;font-size:18px}
.panel p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.panel p+p{margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;font-weight:700;font-size:16px;margin-top:12px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.secondary{background:var(--ink-weak);color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.stat:first-of-type{border-top:0}
.stat span:first-child{color:var(--muted)}
.ok{color:var(--green)}
.warn{color:var(--red)}
.msg{margin-top:10px;font-size:14px}
textarea.dump{width:100%;height:140px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;background:var(--bg)}

/* Editor */
.editor{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.editor.open{transform:none;visibility:visible}
.ebar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.ebar h2{margin:0;font-size:16px;font-weight:700;text-align:center}
.ebar button{font-size:16px;padding:10px 6px}
.ebar .cancel{justify-self:start;color:var(--muted)}
.etc{text-align:center;min-width:0}
.estat{display:block;font-size:12px;line-height:14px;height:14px;color:var(--muted)}
.ebar .save{justify-self:end;color:var(--ink);font-weight:800}
.efields{flex:1;overflow-y:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:620px;width:100%;margin:0 auto}
.lbl{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:20px 0 8px}
.lbl:first-child{margin-top:0}
.field{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;outline:none}
.field:focus{border-color:var(--ink)}
.field::placeholder{color:var(--muted)}
.field.title{font-size:20px;font-weight:700}
textarea.field.body{min-height:42vh;resize:none;font-family:var(--read);font-size:18px;line-height:1.55}
.taginput{display:flex;gap:8px}
.taginput .field{flex:1}
.taginput button{flex:none;padding:0 16px;border-radius:12px;background:var(--ink-weak);color:var(--ink);font-weight:700}
.chosen{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chosen .chip{background:var(--ink);border-color:var(--ink);color:var(--card);display:flex;align-items:center;gap:6px;padding-right:8px}
.chosen .chip b{font-weight:400;font-size:18px;line-height:1}
.hint{font-size:14px;color:var(--muted);margin-top:8px}
.modes{display:grid;gap:8px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.mode .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.mode[aria-checked="true"]{border-color:var(--ink);background:var(--ink-weak)}
.mode[aria-checked="true"] .dot{border:6px solid var(--ink)}
.mode strong{display:block;font-size:16px}
.mode small{display:block;color:var(--muted);font-size:14px;margin-top:1px}
.pv{margin-top:8px}
.del-wrap{margin-top:30px}

/* Dialog */
.dlg{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:var(--scrim)}
.dlg .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%}
.dlg h3{margin:0 0 6px;font-size:19px}
.dlg p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.dlg .acts button{height:46px;border-radius:12px;font-weight:700}
.dlg .no{background:var(--bg)}
.dlg .yes{background:var(--ink);color:var(--card)}
.dlg .yes.red{background:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);z-index:50;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:90vw}
@media (prefers-reduced-motion:reduce){.editor{transition:none}}
/* v2 */
.toast{display:flex;align-items:center;gap:14px}
.toast button{color:var(--bg);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.pin{display:inline-block;width:15px;height:15px;color:var(--ink);vertical-align:-2px;margin-right:4px;flex:none}
.today{margin-top:14px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px}
.today h2{margin:0 0 6px;font-size:15px;color:var(--ink)}
.today button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.today button:first-of-type{border-top:0}
.today button span:last-child{color:var(--muted);white-space:nowrap}
.today button .hot{color:var(--red);font-weight:700}
.cl{margin-top:8px;display:grid;gap:2px}
.cli{display:flex;align-items:flex-start;gap:10px;font-size:16px;padding:3px 0;text-align:left;width:100%}
.ck{flex:none;width:20px;height:20px;margin-top:1px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.ck svg{width:14px;height:14px;opacity:0}
.cli[aria-checked="true"] .ck,.clrow .cb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.cli[aria-checked="true"] .ck svg,.clrow .cb[aria-pressed="true"] svg{opacity:1;color:var(--card)}
.cli[aria-checked="true"] .t{text-decoration:line-through;color:var(--muted)}
.more{font-size:14px;color:var(--muted);margin-top:2px}
.prog{font-size:13px;color:var(--ink);font-weight:700}
.clrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px;margin-top:6px}
.clrow:focus-within{border-color:var(--ink)}
.clrow .cb{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center}
.clrow .cb svg{width:15px;height:15px;opacity:0}
.clrow input{flex:1;border:0;outline:none;background:transparent;font-size:17px;padding:9px 0;min-width:0}
.clrow input.done{text-decoration:line-through;color:var(--muted)}
.clrow .x{flex:none;width:36px;height:36px;font-size:22px;color:var(--muted);border-radius:8px}
.addrow{margin-top:8px;padding:10px 12px;color:var(--ink);font-weight:700;border-radius:10px}
.addrow:active{background:var(--ink-weak)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;text-align:left}
.switch i{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"] i{background:var(--ink)}
.switch[aria-checked="true"] i::after{transform:translateX(18px)}
.streak{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.streak h3{margin:0 0 4px;font-size:16px}
.badge{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--red-weak);color:var(--red)}
.counter[data-tone="mile"]{border-color:var(--red);border-width:1.5px}
.counter[data-tone="mile"] .num b{color:var(--red)}
.trash{display:grid;gap:0}
.trow{padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow strong{display:block;font-size:16px;overflow-wrap:anywhere}
.trow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tacts{display:flex;gap:8px;margin-top:8px}
.tacts button{flex:1;height:40px;border-radius:10px;font-weight:700;font-size:15px}
.tacts .r{background:var(--ink-weak);color:var(--ink)}
.tacts .d{color:var(--red);border:1.5px solid var(--red)}

/* Farben */
.item[data-color]{border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--card));border-left:8px solid var(--c);background:color-mix(in srgb,var(--c) var(--tint),var(--card))}
.item[data-color] .tag{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--text)}
.colors{display:flex;gap:10px;align-items:center;padding:12px 2px 2px;overflow-x:auto;scrollbar-width:none}
.colors::-webkit-scrollbar{display:none}
.colors .sep{flex:none;width:1px;height:24px;background:var(--line)}
.colors .chip{height:32px}
.cdot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;outline:2px solid transparent;outline-offset:1px}
.cdot[aria-pressed="true"]{outline-color:var(--text);border-color:var(--bg)}
.cdot.all{background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:700;width:auto;padding:0 12px;border-radius:999px;color:var(--text)}
.cdot.all[aria-pressed="true"]{background:var(--text);color:var(--bg);outline-color:transparent}
.picker{display:flex;flex-wrap:wrap;gap:12px}
.pick{width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:3px solid transparent;outline:2px solid transparent;outline-offset:1px}
.pick svg{width:20px;height:20px;color:#fff;opacity:0}
.pick[aria-checked="true"]{outline-color:var(--text);border-color:var(--bg)}
.pick[aria-checked="true"] svg{opacity:1}
.pick.none{background:var(--card);border:2px dashed var(--muted)}
.pick.none svg{color:var(--text)}

/* Wischen zum Löschen */
.swipe{position:relative;border-radius:14px;overflow:hidden}
.swipe .under{position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch;background:var(--red);border-radius:14px}
.swipe .under button{width:96px;color:#fff;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.swipe .under svg{width:22px;height:22px}
.swipe>.item{position:relative;touch-action:pan-y;will-change:transform}
.swipe>.item.anim{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.swipe>.item.anim{transition:none}}

/* ===== v6 ===== */
:root{--fs:1;--lines:2}
nav .in{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.tab{font-size:11.5px;min-width:0;padding:0 2px}
.tab span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{-webkit-line-clamp:var(--lines);font-size:calc(16px * var(--fs))}
.item h3{font-size:calc(18px * var(--fs))}
.row .date{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.row .date small{font-size:12px;color:var(--muted)}
.item{cursor:pointer}

/* Rich-Text-Editor */
.rtbar{position:sticky;top:-18px;z-index:3;display:flex;gap:6px;align-items:center;padding:10px 0 8px;margin-top:18px;background:var(--bg)}
.rtbar button{min-width:40px;height:40px;padding:0 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:16px;color:var(--text)}
.rtbar button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.rtbar .gap{flex:1}
.rtbar .fsz{font-size:14px;min-width:44px}
.rt{min-height:52vh;font-family:var(--read);font-size:calc(18px * var(--fs));line-height:1.6;overflow-wrap:anywhere;outline:none;position:relative;cursor:text;padding:14px 16px}
.rt:focus{border-color:var(--ink)}
.rt.empty::before{content:attr(data-ph);color:var(--muted);position:absolute;pointer-events:none}
.rt h3{font-family:var(--ui);font-size:1.22em;font-weight:800;margin:.7em 0 .2em;line-height:1.25}
.rt h3:first-child{margin-top:0}
.rt ul,.rt ol{padding-left:1.4em;margin:.3em 0}
.rt b,.rt strong{font-weight:700}
.rt div,.rt p{margin:0}
.wc{font-size:13px;color:var(--muted);margin-top:6px;text-align:right;font-variant-numeric:tabular-nums}

/* Einstellungen */
.seg2{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px;background:var(--card)}
.seg2 button{flex:1;padding:10px 4px;font-weight:600;font-size:15px;min-width:0}
.seg2 button+button{border-left:1.5px solid var(--line)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.setrow{margin-top:18px}
.setrow:first-of-type{margin-top:10px}
.setrow>b{display:block;font-size:15px}
.setrow>small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.panel .switch{margin-top:10px}
select.field{appearance:auto;-webkit-appearance:auto;margin-top:8px;font-size:16px}
.ver{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}

/* Träume */
.dream{display:flex;gap:14px;align-items:flex-start}
.dday{flex:none;width:46px;text-align:center;padding-right:12px;border-right:1px solid color-mix(in srgb,var(--text) 15%,transparent)}
.dday b{display:block;font-size:26px;line-height:1;font-weight:800;font-variation-settings:"wdth" 80}
.dday span{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.dinfo{flex:1;min-width:0}
.dmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ink-weak);color:var(--ink)}
.pill.m{background:color-mix(in srgb,var(--c,var(--muted)) 22%,var(--card));color:var(--text)}
.stats{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stats .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats .nums b{display:block;font-size:26px;font-weight:800;font-variation-settings:"wdth" 80;line-height:1.1}
.stats .nums span{font-size:12px;color:var(--muted);font-weight:600}
.stats h3{margin:14px 0 8px;font-size:14px;color:var(--muted)}
.stats .chips{padding:0;flex-wrap:wrap}
.moods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.moodbtn{border:1.5px solid var(--line);border-radius:12px;padding:10px 2px;background:var(--card);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.moodbtn i{width:16px;height:16px;border-radius:50%;background:var(--c,var(--muted))}
.moodbtn[aria-checked="true"]{border-color:var(--ink);background:var(--ink-weak)}
textarea.field.dtext{min-height:34vh;resize:none;font-family:var(--read);font-size:calc(18px * var(--fs));line-height:1.55}

/* Verträge */
.sumcard{margin-top:14px;background:var(--ink);color:var(--card);border-radius:16px;padding:16px}
.sumrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sumrow span{display:block;font-size:13px;opacity:.85;font-weight:600}
.sumrow b{display:block;font-size:30px;font-weight:800;font-variation-settings:"wdth" 80;line-height:1.15;font-variant-numeric:tabular-nums}
.cats{margin-top:14px;display:grid;gap:10px}
.cat{font-size:14px}
.cat>div:first-child{display:flex;justify-content:space-between;gap:10px}
.cat .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--card) 25%,transparent);margin-top:4px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--card);border-radius:3px}
.contract{display:flex;gap:14px;align-items:center}
.contract .info{flex:1;min-width:0}
.contract .when{font-size:14px;color:var(--muted);margin-top:3px}
.num.money b{font-size:24px;line-height:1.1}
.kline{margin-top:7px;font-size:14px;font-weight:700}
.contract .extra{font-size:13px;color:var(--muted);margin-top:2px}
.contract[data-tone="soon"] .kline{color:var(--red)}
.contract[data-tone="near"] .kline{color:var(--ink)}
.contract[data-tone="quiet"]{opacity:.72}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .field{margin-top:0}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick .chip[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.money-in{display:flex;align-items:center;gap:8px}
.money-in .field{flex:1}
.money-in span{font-weight:700;font-size:18px;color:var(--muted)}
/* Löschfläche nur beim Wischen */
.swipe .under{visibility:hidden}
.swipe.sw .under{visibility:visible}
.seg2 button{font-size:14.5px}
.note-box{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--ink-weak);font-size:14px;line-height:1.45;color:var(--text)}

/* v8 */
.xres{margin-top:8px}
.xhit{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text)}
.xhit .xk{display:inline-block;font-size:12px;font-weight:700;color:var(--ink);background:var(--ink-weak);border-radius:999px;padding:2px 9px;margin-bottom:6px}
.xhit strong{display:block;font-size:16px;line-height:1.3}
.xhit small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
.xmore{display:block;width:100%;margin-top:8px;padding:10px;border-radius:12px;background:var(--ink-weak);color:var(--ink);font-weight:700;font-size:14.5px}
.dlg .field{margin-top:12px}

/* ===== Post-it-Kacheln (Ansicht „Kacheln“) ===== */
.srow{display:flex;gap:8px}
.srow .search{flex:1;min-width:0}
.vt{flex:none;width:46px;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.vt svg{width:22px;height:22px}
html[data-view="tiles"] .list:not(.xres){display:block;column-count:2;column-gap:10px}
html[data-view="tiles"] .list:not(.xres)>li{break-inside:avoid;margin:0 0 10px;display:block}
html[data-view="tiles"] .list.pv{column-count:1;max-width:220px}
html[data-view="tiles"] .item{border-radius:18px;padding:15px 16px;border:1px solid var(--line);box-shadow:none}
html[data-view="tiles"] .item[data-color]{border:0;background:color-mix(in srgb,var(--c) 26%,var(--card))}
html[data-view="tiles"] .item h3{font-size:calc(18px * var(--fs));font-weight:500;line-height:1.25;overflow-wrap:anywhere}
html[data-view="tiles"] .item:not(.counter):not(.contract):not(.dream){display:flex;flex-direction:column}
html[data-view="tiles"] .item:not(.counter):not(.contract):not(.dream) .row{display:contents}
html[data-view="tiles"] .item:not(.counter):not(.contract):not(.dream) h3{order:1}
html[data-view="tiles"] .item:not(.counter):not(.contract):not(.dream) .preview,html[data-view="tiles"] .item:not(.counter):not(.contract):not(.dream) .cl{order:2}
html[data-view="tiles"] .item:not(.counter):not(.contract):not(.dream) .tags{order:3}
html[data-view="tiles"] .item:not(.counter):not(.contract):not(.dream) .date{order:4}
html[data-view="tiles"] .item .date{display:block;margin-top:8px;font-size:14px}
html[data-view="tiles"] .item .date small{display:none}
html[data-view="tiles"] .item .preview{margin-top:6px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;max-height:calc(5 * 1.4em)}
html[data-view="tiles"] .item h3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
html[data-view="tiles"] .item .cl{max-height:170px;overflow:hidden}
html[data-view="tiles"] .item .cli:nth-of-type(n+5){display:none}
html[data-view="tiles"] .counter .extra,html[data-view="tiles"] .contract .extra,html[data-view="tiles"] .dream .preview{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
html[data-view="tiles"] .item .tags{margin-top:8px}
html[data-view="tiles"] .item .tag:nth-child(n+3){display:none}
/* Zähler, Träume, Verträge: Inhalt untereinander */
html[data-view="tiles"] .counter,html[data-view="tiles"] .contract,html[data-view="tiles"] .dream{display:block}
html[data-view="tiles"] .counter .num,html[data-view="tiles"] .contract .num{text-align:left;margin-top:8px}
html[data-view="tiles"] .counter .num b{font-size:calc(40px * var(--fs))}
html[data-view="tiles"] .contract .num.money b{font-size:calc(22px * var(--fs))}
html[data-view="tiles"] .dream .dday{width:auto;display:flex;align-items:baseline;gap:7px;border:0;padding:0;margin-bottom:6px;text-align:left}
html[data-view="tiles"] .dream .dday b{font-size:22px}
html[data-view="tiles"] .dream .dday span{margin:0}
</style>
</head>
<body>
<div class="page">
  <h1 id="h1">Notizen</h1>
  <div class="sub" id="sub"></div>
  <div id="tools">
    <div class="srow"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Suchen" autocomplete="off" aria-label="Suchen"></label><button class="vt" id="vt" type="button"></button></div>
    <div class="colors" id="colors"></div>
  </div>
  <div id="top"></div>
  <main id="main"></main>
</div>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fabl">Notiz</span></button>

<nav><div class="in" role="tablist" id="nav"></div></nav>

<div class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="etitle">
  <div class="ebar">
    <button class="cancel" id="cancel">Zurück</button>
    <div class="etc"><h2 id="etitle">Neue Notiz</h2><small class="estat" id="estat" aria-live="polite"></small></div>
    <button class="save" id="save">Fertig</button>
  </div>
  <div class="efields" id="efields"></div>
</div>

<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(function(){
const VERSION='13';
const LS='kladde.v1', LSB='kladde.lastBackup', LST='kladde.tab', LSS='kladde.settings';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const svg=(d,w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

/* ---------- Bereiche ---------- */
const SECTIONS=[
  {id:'notes',kind:'note',title:'Notizen',one:'Notiz',many:'Notizen',fab:'Neue Notiz',icon:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/>'},
  {id:'counters',kind:'counter',title:'Zähler',one:'Zähler',many:'Zähler',fab:'Neuer Zähler',icon:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'},
  {id:'dreams',kind:'dream',title:'Träume',one:'Traum',many:'Träume',fab:'Neuer Traum',icon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'},
  {id:'contracts',kind:'contract',title:'Verträge',one:'Vertrag',many:'Verträge',fab:'Neuer Vertrag',icon:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'},
];
const SETTINGS_TAB={id:'settings',title:'Einstellungen',icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};
const KIND_ONE={note:'Notiz',counter:'Zähler',dream:'Traum',contract:'Vertrag'};
const secById=id=>SECTIONS.find(s=>s.id===id);

/* ---------- Einstellungen ---------- */
const DEFAULTS={theme:'auto',fontSize:'m',previewLines:2,sections:{notes:true,counters:true,dreams:true,contracts:true},startTab:'last',showToday:true,trashDays:30,backupDays:7,backupVia:'share',backupEncrypt:false,view:'tiles'};
const FS={s:.9,m:1,l:1.15,xl:1.3}, FS_ORDER=['s','m','l','xl'], FS_LABEL={s:'Klein',m:'Normal',l:'Groß',xl:'Riesig'};
let S=JSON.parse(JSON.stringify(DEFAULTS));
try{const s=JSON.parse(localStorage.getItem(LSS)||'null');if(s)S={...S,...s,sections:{...DEFAULTS.sections,...(s.sections||{})}}}catch(e){}
function saveSettings(){try{localStorage.setItem(LSS,JSON.stringify(S))}catch(e){}}
const enabled=()=>SECTIONS.filter(s=>S.sections[s.id]!==false);
function applySettings(){
  const r=document.documentElement;
  if(S.theme==='auto')delete r.dataset.theme;else r.dataset.theme=S.theme;
  r.dataset.view=S.view==='list'?'list':'tiles';
  r.style.setProperty('--fs',FS[S.fontSize]||1);
  r.style.setProperty('--lines',S.previewLines==='all'?999:S.previewLines);
  const dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0E1424':'#F4F5F8';
}
applySettings();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applySettings)}catch(e){}

/* ---------- Daten ---------- */
let items={}, tab='notes', q='', tagFilter=null, colorFilter=null, draft=null, orig='', isNew=false;
/* Hauptspeicher: IndexedDB. Spiegel in localStorage (solange klein genug) als Rückfall. */
let ready=false, savedAt=0, idbBroken=false, writeChain=Promise.resolve();
const MIRROR_MAX=3500000;
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
function parseStore(s){try{const o=JSON.parse(s);return o&&o.items&&typeof o.items==='object'&&!Array.isArray(o.items)?{items:o.items,savedAt:+o.savedAt||0}:null}catch(e){return null}}
function save(){
  if(!ready)return false;
  savedAt=Date.now();
  const json=JSON.stringify({items,savedAt});
  let lsOk=false;
  if(json.length<MIRROR_MAX){try{localStorage.setItem(LS,json);lsOk=true}catch(e){}}
  if(idbBroken){if(!lsOk)toast('Speichern fehlgeschlagen – Gerätespeicher voll?');return lsOk}
  writeChain=writeChain
    .then(()=>idbDo('readwrite',st=>st.put(json,'main'),'data'))
    .then(()=>{if(json.length>=MIRROR_MAX){try{localStorage.removeItem(LS)}catch(e){}}})
    .catch(()=>{if(!lsOk)toast('Speichern fehlgeschlagen – Gerätespeicher voll?')});
  return true;
}
function normalize(){
  let changed=false;
  for(const i of Object.values(items)){
    if(i.kind==='mark'){i.kind='counter';changed=true}
    if(i.kind==='note'&&i.html==null&&i.body){i.html=textToHtml(i.body);changed=true}
  }
  const cut=Date.now()-(+S.trashDays||30)*864e5;
  for(const id in items){if(items[id].deletedAt&&items[id].deletedAt<cut){delete items[id];changed=true}}
  return changed;
}
function pickTab(){
  let last=null;try{last=localStorage.getItem(LST)}catch(e){}
  if(last==='more'||last==='backup')last='settings';
  const want=S.startTab==='last'?last:S.startTab;
  tab=(want==='settings'||enabled().some(s=>s.id===want))?want:(enabled()[0]||SETTINGS_TAB).id;
}
async function boot(){
  let fromIdb=null,brokenNow=false;
  try{
    const raw=await withTimeout(idbDo('readonly',st=>st.get('main'),'data'),4000);
    if(raw!=null)fromIdb=parseStore(raw);
  }catch(e){brokenNow=true}
  let fromLs=null;try{fromLs=parseStore(localStorage.getItem(LS))}catch(e){}
  idbBroken=brokenNow;
  let src=null,needWrite=false;
  if(fromIdb&&(!fromLs||fromIdb.savedAt>=fromLs.savedAt))src=fromIdb;
  else if(fromLs){src=fromLs;needWrite=!idbBroken}
  items=src?src.items:{};savedAt=src?src.savedAt:0;
  const changed=normalize();
  pickTab();
  ready=true;
  if(needWrite&&Object.keys(items).length){
    try{await makeSnap('migrate')}catch(e){}
    save();await writeChain;
    try{
      const raw=await withTimeout(idbDo('readonly',st=>st.get('main'),'data'),4000);
      const back=raw!=null?parseStore(raw):null;
      if(!back||Object.keys(back.items).length!==Object.keys(items).length)idbBroken=true;
    }catch(e){idbBroken=true}
  }else if(changed)save();
}
/* Wenn eine andere Kladde-Instanz (z. B. Browser-Tab neben der App) neuere Daten geschrieben hat */
async function refreshIfNewer(){
  if(!ready||draft||idbBroken||document.querySelector('.dlg'))return;
  try{
    await writeChain;
    const raw=await withTimeout(idbDo('readonly',st=>st.get('main'),'data'),2500);
    const p=raw!=null?parseStore(raw):null;
    if(p&&p.savedAt>savedAt&&!draft){items=p.items;savedAt=p.savedAt;if(normalize())save();render()}
  }catch(e){}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- Rich Text ---------- */
const ALLOWED={B:1,STRONG:1,I:1,EM:1,U:1,H3:1,UL:1,OL:1,LI:1,BR:1,DIV:1,P:1};
const DROP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,IMG:1,SVG:1,LINK:1,META:1,VIDEO:1,AUDIO:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1};
function sanitize(html){
  const t=document.createElement('template');t.innerHTML=html||'';
  const walk=node=>{for(const ch of [...node.childNodes]){
    if(ch.nodeType===1){
      if(DROP[ch.tagName]){ch.remove();continue}
      walk(ch);
      if(!ALLOWED[ch.tagName]){ch.replaceWith(...ch.childNodes);continue}
      for(const a of [...ch.attributes])ch.removeAttribute(a.name);
    }else if(ch.nodeType!==3)ch.remove();
  }};
  walk(t.content);return t.innerHTML;
}
function htmlToText(html){
  const t=document.createElement('template');t.innerHTML=html||'';
  const BLOCK={DIV:1,P:1,H3:1,LI:1,UL:1,OL:1};let out='';
  const walk=n=>{for(const ch of n.childNodes){
    if(ch.nodeType===3)out+=ch.nodeValue;
    else if(ch.nodeType===1){
      if(ch.tagName==='BR'){out+='\n';continue}
      const b=BLOCK[ch.tagName];
      if(b&&out&&!out.endsWith('\n'))out+='\n';
      if(ch.tagName==='LI')out+='• ';
      walk(ch);
      if(b&&out&&!out.endsWith('\n'))out+='\n';
    }}};
  walk(t.content);
  return out.replace(/ /g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function textToHtml(text){
  if(!text)return '';
  return String(text).split('\n').map(l=>l?`<div>${esc(l)}</div>`:'<div><br></div>').join('');

/* ---------- Datum ---------- */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function P(s){const[y,m,d]=String(s).split('-').map(Number);return{y,m,d}}
function U(p){return Date.UTC(p.y,p.m-1,p.d)}
function diff(a,b){return Math.round((U(b)-U(a))/864e5)}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function addDays(p,n){const d=new Date(U(p)+n*864e5);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}}
function addMonths(p,n){let m0=p.m-1+n,y=p.y+Math.floor(m0/12);m0=((m0%12)+12)%12;return{y,m:m0+1,d:Math.min(p.d,dim(y,m0+1))}}
function fmt(p,y=true){return new Date(U(p)).toLocaleDateString('de-DE',y?{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}:{day:'numeric',month:'long',timeZone:'UTC'})}
function fmtShort(p){return new Date(U(p)).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'})}
function span(a,b){
  let y=b.y-a.y,m=b.m-a.m,d=b.d-a.d;
  if(d<0){m--;const pm=b.m===1?12:b.m-1,py=b.m===1?b.y-1:b.y;d+=dim(py,pm)}
  if(m<0){y--;m+=12}
  const o=[];if(y)o.push(y+(y===1?' Jahr':' Jahre'));if(m)o.push(m+(m===1?' Monat':' Monate'));if(d)o.push(d+(d===1?' Tag':' Tage'));
  return o.join(', ');
}
const T=n=>Math.abs(n)===1?'Tag':'Tage';
const inDays=n=>n===0?'heute':n===1?'morgen':'in '+n+' Tagen';

/* ---------- Zähler ---------- */
const DAY_MS=[7,30,50,100,200,300,500,1000];
function milestones(c){
  const p=P(c.date),t=P(today()),d=diff(p,t);
  if(d<0)return null;
  const days=[...DAY_MS];for(let n=1500;n<=d+1500;n+=500)days.push(n);
  let hitToday=null,next=null;
  if(days.includes(d))hitToday=d+' Tage';
  const nd=days.find(n=>n>d);
  if(nd)next={label:nd+' Tage',in:nd-d};
  for(let k=1;k<200;k++){
    const ay=p.y+k,an={y:ay,m:p.m,d:Math.min(p.d,dim(ay,p.m))},dd=diff(t,an);
    if(dd===0){hitToday=k+(k===1?' Jahr':' Jahre')}
    if(dd>0){if(!next||dd<next.in)next={label:k+(k===1?' Jahr':' Jahre'),in:dd};break}
  }
  return{hitToday,next};
}
function calc(c){
  const t=P(today()),p=P(c.date||today());
  if(c.mode==='since'){
    const d=diff(p,t);
    if(d<0)return{num:-d,unit:T(d)+' bis zum Start',when:'Beginnt am '+fmt(p),tone:'future',k:d};
    const ms=milestones(c)||{};
    const r={num:d,unit:d===0?'Tage – heute gestartet':T(d)+' seit',when:'Seit '+fmt(p),extra:d>=31?span(p,t):'',tone:'',k:d,ms};
    if(ms.hitToday){r.tone='mile';r.badge='🎉 Heute: '+ms.hitToday}
    else if(ms.next)r.next='Nächster Meilenstein: '+ms.next.label+', '+inDays(ms.next.in);
    if(c.best&&c.best>d)r.best='Rekord: '+c.best+' '+T(c.best);
    else if(c.restarts)r.best='Neuer Rekord läuft';
    return r;
  }
  if(c.mode==='until'){
    const d=diff(t,p);
    if(d<0)return{num:-d,unit:T(d)+' überfällig',when:'War am '+fmt(p),tone:'over',k:d};
    if(d===0)return{num:0,unit:'Heute ist es so weit',when:'Heute, '+fmt(p),tone:'soon',k:0};
    return{num:d,unit:T(d)+' noch',when:'Am '+fmt(p),extra:d>=31?span(t,p):'',tone:d<=7?'soon':'',k:d};
  }
  let y=t.y,nx={y,m:p.m,d:Math.min(p.d,dim(y,p.m))};
  if(diff(t,nx)<0){y++;nx={y,m:p.m,d:Math.min(p.d,dim(y,p.m))}}
  const d=diff(t,nx),n=nx.y-p.y;
  const nth=n>0?` (${n}. Mal)`:'';
  if(d===0)return{num:0,unit:'Heute'+nth,when:'Jedes Jahr am '+fmt(p,false),tone:'soon',k:0};
  return{num:d,unit:T(d)+' noch',when:'Nächstes Mal am '+fmt(nx)+nth,extra:'Jedes Jahr, seit '+p.y,tone:d<=7?'soon':'',k:d};
}

const IV={month:[1,'pro Monat','Monatlich'],quarter:[3,'pro Quartal','Vierteljährlich'],half:[6,'pro Halbjahr','Halbjährlich'],year:[12,'pro Jahr','Jährlich']};
const monthly=c=>(+c.cost||0)/((IV[c.interval]||IV.month)[0]);
function noticeShift(p,c,sign){
  const n=+c.noticeN||0;if(!n)return p;
  if(c.noticeU==='months')return addMonths(p,sign*n);
  return addDays(p,sign*(c.noticeU==='weeks'?7*n:n));
}
function contractInfo(c){
  const t=P(today());
  if(c.cancelled){
    if(!c.endDate)return{state:'cancelled',label:'Gekündigt',tone:'quiet',active:true,rank:4};
    const e=P(c.endDate),d=diff(t,e);
    if(d<0)return{state:'ended',label:'Beendet am '+fmt(e),tone:'quiet',active:false,rank:5};
    return{state:'cancelled',label:'Gekündigt – endet '+(d===0?'heute':'am '+fmt(e)),sub:d>0?'noch '+d+' '+T(d):'',tone:'quiet',active:true,rank:4,k:d};
  }
  const flex=()=>{const earliest=noticeShift(t,c,1);return{state:'flex',label:'Jederzeit kündbar',sub:(+c.noticeN?'Kündigst du heute, endet er frühestens am '+fmt(earliest):'Kündigung wirkt sofort bzw. zum Ende der bezahlten Zeit'),tone:'',active:true,rank:2}};
  if(!c.start){
    if((c.renewal||'monthly')==='monthly'&&!+c.minTerm)return flex();
    return{state:'nodate',label:'Vertragsbeginn fehlt – Frist unbekannt',sub:'Trag den Beginn ein, dann rechnet die App die Frist aus',tone:'',active:true,rank:3};
  }
  const s=P(c.start),M=+c.minTerm||0;
  const endOf=mo=>addDays(addMonths(s,mo),-1);
  const dl=e=>{const d=noticeShift(e,c,-1),dd=diff(t,d);return dd>=0?{state:'term',deadline:d,end:e,dl:dd,label:dd===0?'Heute letzter Tag zum Kündigen!':'Kündigen bis '+fmt(d),sub:(dd>0?'noch '+dd+' '+T(dd)+' – ':'')+'dann endet er am '+fmt(e),tone:dd<=14?'soon':dd<=60?'near':'',active:true,rank:dd<=60?0:1,k:dd}:null};
  if(c.renewal==='end'){
    if(!M)return{state:'nodate',label:'Laufzeit fehlt',tone:'',active:true,rank:3};
    const e=endOf(M),d=diff(t,e);
    if(d<0)return{state:'ended',label:'Ausgelaufen am '+fmt(e),tone:'quiet',active:false,rank:5};
    return{state:'fixed',label:'Endet automatisch am '+fmt(e),sub:'noch '+d+' '+T(d)+', Kündigen nicht nötig',tone:'',active:true,rank:2,k:d};
  }
  if(M){const r=dl(endOf(M));if(r)return r}
  if(c.renewal==='extend'){
    const X=Math.max(1,+c.extendM||12);
    for(let k=1;k<600;k++){const r=dl(endOf(M+k*X));if(r)return r}
  }
  return flex();
}

function noteCard(n){

/* ---------- Datenschutz: Netzsperre prüfen ---------- */
const sizeText=b=>b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB';
let netState=null;
/* Versucht eine Verbindung zu einer Adresse, die es nicht gibt (.invalid). Blockiert die Netzsperre das, meldet der Browser eine Regelverletzung. Es wird nichts gesendet. */
function netCheck(){return new Promise(res=>{
  let done=false;
  const on=e=>{if(String(e.blockedURI).includes('kladde-pruefung.invalid'))fin(true)};
  const fin=v=>{if(done)return;done=true;document.removeEventListener('securitypolicyviolation',on);res(v)};
  document.addEventListener('securitypolicyviolation',on);
  try{fetch('https://kladde-pruefung.invalid/').catch(()=>{})}catch(e){}
  setTimeout(()=>fin(false),1500);
})}
async function netRun(){
  const el=$('#pnet');if(!el)return;
  if(netState===null){el.textContent='wird geprüft …';el.className='';netState=await netCheck()}
  const e2=$('#pnet');if(!e2)return;
  e2.textContent=netState?'aktiv':'NICHT aktiv';e2.className=netState?'ok':'warn';
}

/* ---------- Sicherung ---------- */
function canShareFiles(type='application/json',name='t.json'){try{return!!(navigator.canShare&&navigator.canShare({files:[new File(['x'],name,{type})]}))}catch(e){return false}}
function markBackup(){try{localStorage.setItem(LSB,String(Date.now()))}catch(e){}}
/* Datei an den Nutzer geben: Teilen-Dialog, sonst Download. Rückgabe: 'shared' | 'downloaded' | 'aborted' */
async function deliverFile(file,title,prefer){
  if(prefer!=='download'&&canShareFiles(file.type,file.name)){
    try{await navigator.share({files:[file],title});return 'shared'}
    catch(e){if(e&&e.name==='AbortError')return 'aborted'}
  }
  const url=URL.createObjectURL(file);const l=document.createElement('a');l.href=url;l.download=file.name;document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return 'downloaded';
}

/* ---------- Verschlüsselung (Web Crypto, alles auf dem Gerät) ---------- */
const b64=buf=>{let t='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)t+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const KDF_ITER=250000;
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptText(text,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt,KDF_ITER);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));
  return JSON.stringify({app:'kladde',enc:1,kdf:'PBKDF2-SHA256',iter:KDF_ITER,salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function decryptText(obj,pw){
  const key=await deriveKey(pw,unb64(obj.salt),+obj.iter||KDF_ITER);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data));
  return new TextDecoder().decode(pt);
}
function askPass(title,text,confirm,err){return new Promise(r=>{
  const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p>
    <input class="field" id="pw1" type="password" autocomplete="${confirm?'new-password':'current-password'}" placeholder="Passwort">
    ${confirm?'<input class="field" id="pw2" type="password" autocomplete="new-password" placeholder="Passwort wiederholen" style="margin-top:8px">':''}
    <div class="hint" id="pwe" style="color:var(--red);min-height:20px">${esc(err||'')}</div>
    <div class="acts"><button class="no">Abbrechen</button><button class="yes">OK</button></div></div>`;
  document.body.appendChild(d);
  const p1=d.querySelector('#pw1'),p2=d.querySelector('#pw2'),er=d.querySelector('#pwe');
  const done=v=>{d.remove();r(v)};
  const ok=()=>{
    const a=p1.value;
    if(confirm){if(a.length<8){er.textContent='Mindestens 8 Zeichen.';return}if(a!==p2.value){er.textContent='Die beiden Eingaben sind nicht gleich.';return}}
    else if(!a){er.textContent='Bitte Passwort eingeben.';return}
    done(a);
  };
  d.querySelector('.no').onclick=()=>done(null);d.querySelector('.yes').onclick=ok;
  d.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}else if(e.key==='Escape')done(null)};
  p1.focus();
})}
let sessPass=null;
async function doExport(){
  let payload=JSON.stringify({app:'kladde',version:8,exportedAt:new Date().toISOString(),settings:S,items:Object.values(items)},null,1);
  let enc=false;
  if(S.backupEncrypt){
    if(!hasCrypto()){toast('Verschlüsseln geht hier nicht. Öffne die App über ihre https-Adresse.');return}
    let pw=sessPass;
    if(!pw){
      pw=await askPass('Passwort für die Sicherung','Ohne dieses Passwort kann niemand die Datei öffnen, auch ich nicht. Es wird nirgends gespeichert. Schreib es dir auf.',true);
      if(!pw)return;
    }
    try{payload=await encryptText(payload,pw);enc=true;sessPass=pw}catch(e){toast('Verschlüsseln hat nicht geklappt');return}
  }
  const now=new Date(),name='kladde-sicherung-'+today()+'-'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0')+(enc?'-verschluesselt':'')+'.json';
  const r=await deliverFile(new File([payload],name,{type:'application/json'}),'Kladde-Sicherung',S.backupVia);
  if(r==='aborted'){toast('Sicherung abgebrochen');return}
  markBackup();toast(r==='shared'?'Sicherung gespeichert':'Sicherung im Download-Ordner');render();
}

/* ---------- Kalender-Datei (.ics) ---------- */
const CAL_ICON='<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>';
const icsEsc=t=>String(t??'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsD=p=>String(p.y).padStart(4,'0')+String(p.m).padStart(2,'0')+String(p.d).padStart(2,'0');
function icsFold(line){const out=[];let t=line;while(t.length>60){out.push(t.slice(0,60));t=' '+t.slice(60)}out.push(t);return out.join('\r\n')}
function buildIcs(evts){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kladde//DE','CALSCALE:GREGORIAN'];
  for(const e of evts){
    L.push('BEGIN:VEVENT','UID:'+e.uid+'@kladde.local','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsD(e.date),'DTEND;VALUE=DATE:'+icsD(addDays(e.date,1)),'SUMMARY:'+icsEsc(e.title));
    if(e.desc)L.push('DESCRIPTION:'+icsEsc(e.desc));
    if(e.rrule)L.push('RRULE:'+e.rrule);
    for(const a of e.alarms||[])L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:'+a,'END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';
}
/* Erinnerungen: 09:00 Uhr am jeweiligen Tag. -P13DT15H = 14 Tage vor Mitternacht minus 15 h = 09:00, 14 Tage vorher */
function icsEventFor(d){
  if(d.kind==='counter'&&d.date&&(d.mode==='until'||d.mode==='yearly')){
    const r=calc(d),title=(d.title||'').trim()||'Termin';
    if(d.mode==='until'){
      if(r.k<0)return null;
      return{uid:d.id,date:P(d.date),title,desc:d.note||'',alarms:['-P1DT15H','PT9H'],hint:'Erinnerung am Vortag und am Tag selbst um 9 Uhr.'};
    }
    return{uid:d.id,date:addDays(P(today()),r.k),title,desc:d.note||'',rrule:'FREQ=YEARLY',alarms:['-P6DT15H','PT9H'],hint:'Jedes Jahr, mit Erinnerung eine Woche vorher und am Tag selbst um 9 Uhr.'};
  }
  if(d.kind==='contract'){
    const r=contractInfo(d);
    if(r.state!=='term'||!r.deadline)return null;
    const t=(d.title||'').trim()||'Vertrag';
    const desc=['Letzter Tag zum Kündigen. Danach endet der Vertrag am '+fmt(r.end)+'.',d.provider?'Anbieter: '+d.provider:'',d.number?'Nummer: '+d.number:'',d.note||''].filter(Boolean).join('\n');
    return{uid:d.id+'-'+icsD(r.deadline),date:r.deadline,title:'Kündigen: '+t,desc,alarms:['-P13DT15H','-P2DT15H','PT9H'],hint:'Mit Erinnerung 14 und 3 Tage vorher und am letzten Tag um 9 Uhr.'};
  }
  return null;
}
function calBox(){
  const w=$('#calw');if(!w||!draft)return;
  const ev=icsEventFor(draft);
  if(!ev){w.innerHTML='';return}
  w.innerHTML=`<button class="btn secondary" id="ical">${svg(CAL_ICON,2.2)}In Kalender eintragen</button><div class="hint">${esc(ev.hint)} Es entsteht eine Kalender-Datei, die du mit deiner Kalender-App öffnest. Manche Apps (z. B. Google Kalender) nutzen statt dieser Erinnerungen ihre eigenen Standardzeiten.</div>`;
  $('#ical').onclick=()=>exportIcs(ev);
}
async function exportIcs(ev){
  const slug=ev.title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'termin';
  const file=new File([buildIcs([ev])],'kladde-'+slug+'.ics',{type:'text/calendar'});
  const r=await deliverFile(file,ev.title);
  if(r==='aborted')return;
  toast(r==='shared'?'Kalender-Datei geteilt':'Kalender-Datei im Download-Ordner. Öffne sie mit deiner Kalender-App.');
}

/* ---------- Automatische Kopien (IndexedDB) ---------- */
const SNAP_KEEP_DAILY=7,SNAP_KEEP_EXTRA=3,LSK='kladde.snapSkip';
let idbP=null;
function idb(){
  if(!idbP)idbP=new Promise((res,rej)=>{
    try{const r=indexedDB.open('kladde',2);
      r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('snaps'))db.createObjectStore('snaps',{keyPath:'id'});if(!db.objectStoreNames.contains('data'))db.createObjectStore('data')};
      r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{db.close();idbP=null};res(db)};r.onerror=()=>rej(r.error);}catch(e){rej(e)}
  });
  return idbP;
}
function idbDo(mode,fn,store='snaps'){return idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(store,mode),st=t.objectStore(store);let out;
  const r=fn(st);if(r&&'onsuccess'in r)r.onsuccess=()=>{out=r.result};
  t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
}))}
const snapList=()=>idbDo('readonly',st=>st.getAll()).then(l=>(l||[]).sort((a,b)=>b.ts-a.ts)).catch(()=>[]);
function countsOf(obj){const c={};for(const i of Object.values(obj))if(!i.deletedAt)c[i.kind]=(c[i.kind]||0)+1;return c}
async function makeSnap(reason){
  const live=Object.values(items).filter(i=>!i.deletedAt);
  if(!live.length)return;
  const ts=Date.now(),daily=reason==='daily';
  const snap={id:daily?'d-'+today():'x-'+ts,ts,reason,counts:countsOf(items),data:JSON.stringify(items)};
  try{
    await idbDo('readwrite',st=>st.put(snap));
    const all=await snapList();
    const d=all.filter(x=>x.id.startsWith('d-')),x=all.filter(x=>x.id.startsWith('x-'));
    const drop=[...d.slice(SNAP_KEEP_DAILY),...x.slice(SNAP_KEEP_EXTRA)];
    if(drop.length)await idbDo('readwrite',st=>{drop.forEach(o=>st.delete(o.id))});
  }catch(e){}
}
async function dailySnap(){
  if(!ready||idbBroken)return;
  try{if(localStorage.getItem(LSK)===today())return}catch(e){}
  try{const all=await snapList();if(!all.some(x=>x.id==='d-'+today()))await makeSnap('daily')}catch(e){}
}
const SNAP_REASON={daily:'Tägliche Kopie',restore:'Vor dem Wiederherstellen',import:'Vor dem Laden einer Sicherung',migrate:'Sicherheitskopie beim Speicher-Umzug'};
function countText(c){return SECTIONS.map(s=>c[s.kind]?c[s.kind]+' '+(c[s.kind]===1?s.one:s.many):'').filter(Boolean).join(', ')||'leer'}
async function drawSnaps(){
  const box=$('#snaps');if(!box)return;
  const all=await snapList();
  if(!$('#snaps'))return;
  if(!all.length){box.innerHTML='<p>Keine Kopie vorhanden. Eine neue entsteht automatisch, sobald du die App an einem neuen Tag öffnest.</p>';return}
  box.innerHTML=`<div class="trash">${all.map(x=>{const d=new Date(x.ts);return`<div class="trow"><strong>${d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'})}, ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</strong><small>${SNAP_REASON[x.reason]||'Kopie'} · ${esc(countText(x.counts||{}))}</small><div class="tacts"><button class="r" data-snap="${esc(x.id)}">Diesen Stand wiederherstellen</button><button class="d" data-snapdel="${esc(x.id)}" style="flex:none;padding:0 16px">Löschen</button></div></div>`}).join('')}</div>`;
  box.querySelectorAll('[data-snapdel]').forEach(b=>b.onclick=async()=>{
    const x=all.find(y=>y.id===b.dataset.snapdel);if(!x)return;
    const d=new Date(x.ts);
    if(!await ask('Kopie löschen?',`Die Kopie vom ${d.toLocaleDateString('de-DE',{day:'numeric',month:'long'})}, ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr wird endgültig entfernt. Deine jetzigen Einträge bleiben unberührt.`,'Löschen',true))return;
    try{
      await idbDo('readwrite',st=>{st.delete(x.id)});
      if(x.id==='d-'+today()){try{localStorage.setItem(LSK,today())}catch(e){}}
    }catch(e){toast('Löschen hat nicht geklappt');return}
    toast('Kopie gelöscht');drawSnaps();
  });
  box.querySelectorAll('[data-snap]').forEach(b=>b.onclick=async()=>{
    const x=all.find(y=>y.id===b.dataset.snap);if(!x)return;
    const d=new Date(x.ts);
    if(!await ask('Stand wiederherstellen?',`Die App springt auf den Stand vom ${d.toLocaleDateString('de-DE',{day:'numeric',month:'long'})}, ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr zurück. Dein jetziger Stand wird vorher als Kopie gesichert – du kannst also zurück.`,'Wiederherstellen'))return;
    let data;try{data=JSON.parse(x.data)}catch(e){toast('Diese Kopie ist beschädigt');return}
    await makeSnap('restore');
    items=data;save();render();toast('Stand wiederhergestellt');
  });
}

/* ---------- Beim Öffnen: Sicherung fällig? ---------- */
const LSZ='kladde.backupSnooze';
let duePrompted=false;
async function checkBackupDue(){
  const bd=+S.backupDays;if(duePrompted||!bd||draft||document.querySelector('.dlg'))return;
  if(live().length<3)return;
  const lb=lastBackup();if(lb&&daysSince(lb)<bd)return;
  let snooze=null;try{snooze=localStorage.getItem(LSZ)}catch(e){}
  if(snooze===today())return;
  const where=S.backupVia!=='download'&&canShareFiles()?'Ein Tipp – dann z. B. Google Drive wählen.':'Ein Tipp – die Datei landet im Download-Ordner.';
  duePrompted=true;
  const r=await ask('Zeit für eine Sicherung',(lb?'Deine letzte Sicherung ist '+daysSince(lb)+' Tage her. ':'Du hast noch keine Sicherung gemacht. ')+where,'Jetzt sichern',false,'Später');
  if(r)doExport();else{try{localStorage.setItem(LSZ,today())}catch(e){}}
}

$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let list,j;
  try{j=JSON.parse(await f.text())}catch(err){toast('Das ist keine gültige Sicherungsdatei');return}
  if(j&&j.enc){
    if(!hasCrypto()){toast('Entschlüsseln geht hier nicht. Öffne die App über ihre https-Adresse.');return}
    let plain=null,err='';
    while(plain==null){
      const pw=await askPass('Passwort eingeben','Diese Sicherung ist verschlüsselt.',false,err);
      if(pw==null)return;
      try{plain=await decryptText(j,pw)}catch(e){err='Falsches Passwort oder beschädigte Datei.'}
    }
    try{j=JSON.parse(plain)}catch(e){toast('Die Datei ist beschädigt');return}
  }
  try{list=Array.isArray(j)?j:j.items;if(!Array.isArray(list))throw 0}
  catch(err){toast('Das ist keine gültige Sicherungsdatei');return}
  list=list.filter(i=>i&&typeof i.id==='string'&&['note','counter','mark','dream','contract'].includes(i.kind)).map(i=>{
    const x={...i,kind:i.kind==='mark'?'counter':i.kind};
    if(x.kind==='note'){x.html=x.html!=null?sanitize(x.html):textToHtml(x.body||'')}
    return x;
  });
  if(!list.length){toast('Die Datei enthält keine Einträge');return}
  const parts=SECTIONS.map(s=>{const n=list.filter(i=>i.kind===s.kind).length;return n?n+' '+(n===1?s.one:s.many):''}).filter(Boolean).join(', ');
  if(!await ask('Sicherung laden?',`Gefunden: ${parts}. Sie werden mit deinen jetzigen Einträgen zusammengeführt. Bei doppelten Einträgen gewinnt die neuere Fassung.`,'Laden'))return;
  await makeSnap('import');
  let added=0;
  for(const i of list){const o=items[i.id];if(!o||(i.updatedAt||0)>(o.updatedAt||0)){items[i.id]=i;added++}}
  save();render();toast(added+' Einträge übernommen');
};

/* ---------- Editor: allgemein ---------- */
/* Automatisch speichern: alles, was du tippst oder änderst, wird nach einer halben Sekunde gesichert.
   „Zurück“, „Fertig“, die Zurück-Geste des Handys und das Wechseln in eine andere App speichern ebenfalls. */
let saved=null, origItem=null, autoT=0, edHist=false, pendingBack=0, editChanged=false;
function cleanCopy(d){const c=JSON.parse(JSON.stringify(d));if(c.checklist)c.checklist=c.checklist.filter(x=>x.text.trim());delete c._touched;return c}
const sigOf=d=>{const c=cleanCopy(d);delete c.updatedAt;return JSON.stringify(c)};
function setStat(t){const e=$('#estat');if(e)e.textContent=t}
function autosave(){
  if(!draft)return false;
  if(draft.kind==='note')syncNote();
  if(isEmpty(draft))return false;
  const sg=sigOf(draft);
  if(sg===saved)return false;
  touch(cleanCopy(draft));
  saved=sg;editChanged=true;
  setStat('Automatisch gespeichert');
  return true;
}
function scheduleAuto(){clearTimeout(autoT);autoT=setTimeout(autosave,500)}
function flushAuto(){clearTimeout(autoT);autosave()}
function openEditor(item,fresh){
  draft=JSON.parse(JSON.stringify(item));isNew=fresh;
  if(draft.kind==='note'&&draft.html==null)draft.html=textToHtml(draft.body||'');
  orig=JSON.stringify(draft);
  const one=KIND_ONE[draft.kind];
  $('#etitle').textContent=fresh?({note:'Neue Notiz',counter:'Neuer Zähler',dream:'Neuer Traum',contract:'Neuer Vertrag'})[draft.kind]:one+' bearbeiten';
  setStat('');
  ({note:noteForm,counter:counterForm,dream:dreamForm,contract:contractForm})[draft.kind]();
  orig=JSON.stringify(draft);
  origItem=fresh?null:JSON.parse(JSON.stringify(item));
  saved=fresh?null:sigOf(draft);editChanged=false;
  $('#editor').classList.add('open');
  if(!edHist){try{history.pushState({kladdeEd:1},'');edHist=true}catch(e){}}
  $('#efields').scrollTop=0;
  if(fresh){const f={note:'#nt',dream:'#dtx',contract:'#kt',counter:null}[draft.kind];if(f)setTimeout(()=>{const el=$(f);el&&el.focus()},300)}
}
function shutEditor(){
  clearTimeout(autoT);
  $('#editor').classList.remove('open');draft=null;
  if(edHist){edHist=false;pendingBack++;try{history.back()}catch(e){pendingBack--}}
}
function closeEditor(){shutEditor();render()}
function clean(d){if(d.checklist)d.checklist=d.checklist.filter(x=>x.text.trim());delete d._touched;return d}
function isEmpty(d){
  if(d.kind==='note')return!(d.title||'').trim()&&!(d.body||'').trim()&&!(d.checklist||[]).some(x=>x.text.trim());
  if(d.kind==='dream')return!(d.title||'').trim()&&!(d.text||'').trim();
  return!(d.title||'').trim();
}
function finishEdit(){
  if(!draft)return;
  clearTimeout(autoT);
  autosave();
  const id=draft.id,wasNew=isNew,prev=origItem,changed=editChanged;
  const emptied=isEmpty(draft)&&!wasNew&&sigOf(draft)!==saved;
  shutEditor();render();
  if(emptied)toast('Leer – der bisherige Inhalt bleibt erhalten');
  else if(changed){
    if(!wasNew&&prev)toast('Gespeichert','Rückgängig',()=>{items[id]=prev;save();render()});
    else toast('Gespeichert');
  }
}
window.addEventListener('popstate',()=>{
  if(pendingBack>0){pendingBack--;return}
  if(draft&&edHist){edHist=false;finishEdit()}
});

  $('#nt').oninput=e=>draft.title=e.target.value;
  nb.addEventListener('input',()=>{syncNote();updateBar()});
  nb.addEventListener('paste',e=>{
    const t=(e.clipboardData||window.clipboardData).getData('text/plain');
    e.preventDefault();document.execCommand('insertText',false,t);
  });
  nb.addEventListener('keyup',updateBar);nb.addEventListener('mouseup',updateBar);nb.addEventListener('focus',updateBar);
  $('.rtbar').addEventListener('pointerdown',e=>{if(e.target.closest('button'))e.preventDefault()});
  $('.rtbar').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
  $('.rtbar').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.fs){
      const i=Math.min(FS_ORDER.length-1,Math.max(0,FS_ORDER.indexOf(S.fontSize)+ +b.dataset.fs));
      S.fontSize=FS_ORDER[i];saveSettings();applySettings();toast('Schriftgröße: '+FS_LABEL[S.fontSize]);return;
    }
    if(document.activeElement!==nb){nb.focus();placeCaretEnd(nb)}
    try{document.execCommand('styleWithCSS',false,false)}catch(_){}
    const c=b.dataset.cmd;
    if(c==='bold')document.execCommand('bold');
    else if(c==='h3'){const cur=String(document.queryCommandValue('formatBlock')||'').toLowerCase().replace(/[<>]/g,'');document.execCommand('formatBlock',false,cur==='h3'?'<div>':'<h3>')}
    else if(c==='ul')document.execCommand('insertUnorderedList');
    else if(c==='ol')document.execCommand('insertOrderedList');
    syncNote();updateBar();
  };
  $('#cladd').onclick=()=>addItem(draft.checklist.length);
  bindTags('tags',noteTags,'#');bindPin();bindColor();bindDel();
  drawList();syncNote();
}
function placeCaretEnd(el){const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function syncNote(){
  const nb=$('#nb');if(!nb||!draft||draft.kind!=='note')return;
  const html=nb.innerHTML;
  const text=htmlToText(html);
  draft.html=text||/<(ul|ol|h3)/i.test(html)?sanitize(html):'';
  draft.body=text;
  nb.classList.toggle('empty',!text&&!/<(ul|ol|li)/i.test(html));
  const w=wordCount(text),ch=text.replace(/\n/g,'').length;
  $('#wc').textContent=`${w} ${w===1?'Wort':'Wörter'} · ${ch} Zeichen`;
}
function updateBar(){
  const bar=$('.rtbar');if(!bar)return;
  const inEd=document.activeElement===$('#nb');
  const st=c=>{try{return document.queryCommandState(c)}catch(e){return false}};
  let blk='';try{blk=String(document.queryCommandValue('formatBlock')||'').toLowerCase().replace(/[<>]/g,'')}catch(e){}
  const set=(c,v)=>{const b=bar.querySelector(`[data-cmd="${c}"]`);if(b)b.setAttribute('aria-pressed',inEd&&v?'true':'false')};
  set('bold',st('bold'));set('h3',blk==='h3');set('ul',st('insertUnorderedList'));set('ol',st('insertOrderedList'));
}
document.addEventListener('selectionchange',()=>{if(draft&&draft.kind==='note')updateBar()});
function addItem(at){draft.checklist.splice(at,0,{id:newId('i'),text:'',done:false});drawList(at)}
function drawList(focusAt){
  const w=$('#clw');
  w.innerHTML=draft.checklist.map((x,i)=>`<div class="clrow"><button class="cb" aria-pressed="${!!x.done}" aria-label="abhaken" data-i="${i}">${TICK}</button><input data-i="${i}" class="${x.done?'done':''}" value="${esc(x.text)}" placeholder="Punkt" enterkeyhint="next"><button class="x" data-i="${i}" aria-label="Punkt entfernen">×</button></div>`).join('');
  w.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{const x=draft.checklist[+b.dataset.i];x.done=!x.done;drawList()});
  w.querySelectorAll('.x').forEach(b=>b.onclick=()=>{draft.checklist.splice(+b.dataset.i,1);drawList()});
  w.querySelectorAll('input').forEach(inp=>{
    const i=+inp.dataset.i;
    inp.oninput=()=>draft.checklist[i].text=inp.value;
    inp.onkeydown=e=>{
      if(e.key==='Enter'){e.preventDefault();addItem(i+1)}
      else if(e.key==='Backspace'&&!inp.value){e.preventDefault();draft.checklist.splice(i,1);drawList(Math.max(0,i-1))}
    };
  });
  if(focusAt!=null){const f=w.querySelector(`input[data-i="${focusAt}"]`);if(f){f.focus();const v=f.value;f.value='';f.value=v}}
}

/* Wischen zum Löschen */
const OPEN_X=-96;
let sw=null,openSwipe=null,swipeJustEnded=false;
function setX(el,x,anim){
  el.classList.toggle('anim',!!anim);el.style.transform=x?`translateX(${x}px)`:'';
  const li=el.parentElement;clearTimeout(li._t);
  if(x)li.classList.add('sw');else li._t=setTimeout(()=>li.classList.remove('sw'),anim?230:0);
}
function closeSwipe(){if(openSwipe){setX(openSwipe,0,true);openSwipe=null}}
$('#main').addEventListener('pointerdown',e=>{
  const el=e.target.closest('.swipe>.item');
  if(!el||e.button>0)return;
  if(openSwipe&&openSwipe!==el)closeSwipe();
  sw={el,x0:e.clientX,y0:e.clientY,base:el===openSwipe?OPEN_X:0,dx:0,mode:null,id:e.pointerId};
});
$('#main').addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.mode){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    sw.mode=Math.abs(dx)>Math.abs(dy)?'h':'v';
    if(sw.mode==='h'){try{sw.el.setPointerCapture(e.pointerId)}catch(_){}}
  }
  if(sw.mode!=='h')return;
  e.preventDefault();
  let x=Math.min(0,sw.base+dx);const w=sw.el.offsetWidth;if(x<-w)x=-w;
  sw.dx=x;setX(sw.el,x,false);
});
function endSwipe(e){
  if(!sw||(e&&e.pointerId!==sw.id))return;
  const s0=sw;sw=null;
  if(s0.mode!=='h')return;
  swipeJustEnded=true;setTimeout(()=>swipeJustEnded=false,350);
  const w=s0.el.offsetWidth;
  if(s0.dx<-w*0.6){setX(s0.el,-w,true);openSwipe=null;const id=s0.el.dataset.id;setTimeout(()=>softDelete(id),200)}
  else if(s0.dx<OPEN_X/2){setX(s0.el,OPEN_X,true);openSwipe=s0.el}
  else{setX(s0.el,0,true);if(openSwipe===s0.el)openSwipe=null}
}
$('#main').addEventListener('pointerup',endSwipe);
$('#main').addEventListener('pointercancel',endSwipe);
document.addEventListener('pointerdown',e=>{if(openSwipe&&!e.target.closest('.swipe'))closeSwipe()},true);
window.addEventListener('scroll',()=>{if(openSwipe&&!sw)closeSwipe()},{passive:true});

$('#fab').onclick=()=>{
  const cf=colorFilter,tf=tagFilter;
  if(tab==='notes')openEditor({id:newId('n'),kind:'note',title:'',body:'',html:'',tags:tf?[tf]:[],checklist:[],...(cf?{color:cf}:{})},true);
  else if(tab==='counters')openEditor({id:newId('c'),kind:'counter',title:'',date:today(),mode:'since',note:'',...(cf?{color:cf}:{})},true);
  else if(tab==='dreams')openEditor({id:newId('d'),kind:'dream',date:today(),title:'',text:'',symbols:tf?[tf]:[],...(cf?{mood:cf}:{})},true);
  else if(tab==='contracts')openEditor({id:newId('k'),kind:'contract',title:'',provider:'',cat:cf||'',cost:'',interval:'month',start:'',minTerm:0,renewal:'monthly',extendM:12,noticeN:1,noticeU:'months',note:'',number:''},true);
};
$('#save').onclick=finishEdit;
$('#cancel').onclick=finishEdit;
['input','change','click','keyup'].forEach(ev=>$('#efields').addEventListener(ev,scheduleAuto));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&draft&&!document.querySelector('.dlg'))finishEdit()});
let day=today();
const tick=()=>{if(today()!==day){day=today();if(!draft)render()}};
setInterval(tick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- Offline ---------- */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

/* Teilen an die Kladde: Der geteilte Text kommt in der Adresse an. Der Service Worker bedient diese Anfrage nur aus dem Speicher des Handys (siehe sw.js). */
function handleShare(u){
  const title=(u.searchParams.get('title')||'').trim().slice(0,200);
  const text=(u.searchParams.get('text')||'').trim().slice(0,200000);
  const link=(u.searchParams.get('url')||'').trim().slice(0,2000);
  if(!title&&!text&&!link)return false;
  ['title','text','url'].forEach(k=>u.searchParams.delete(k));
  history.replaceState(null,'',u.pathname+(u.search||'')+u.hash);
  let body=text;
  if(link&&!body.includes(link))body=body?body+'\n'+link:link;
  const it={id:newId('n'),kind:'note',title:title===text?'':title,body,html:textToHtml(body),tags:[],checklist:[]};
  if(S.sections.notes===false){S.sections.notes=true;saveSettings()}
  touch(it);
  go('notes');
  openEditor(JSON.parse(JSON.stringify(items[it.id])),false);
  toast('Als Notiz gespeichert');
  return true;
}
function handleShortcut(){
  try{
    const u=new URL(location.href);
    if(handleShare(u))return;
    const n=u.searchParams.get('neu');
    if(!n)return;
    u.searchParams.delete('neu');history.replaceState(null,'',u.pathname+(u.search||'')+u.hash);
    if(secById(n)&&enabled().some(x=>x.id===n)){go(n);$('#fab').click()}
  }catch(e){}
}
(async()=>{
  try{await boot()}
  catch(e){
    try{const st=parseStore(localStorage.getItem(LS));if(st){items=st.items;savedAt=st.savedAt}}catch(_){}
    idbBroken=true;ready=true;pickTab();
  }
  render();
  handleShortcut();
  dailySnap();
  setTimeout(checkBackupDue,900);
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshIfNewer();dailySnap();setTimeout(checkBackupDue,600)}});
})();
